<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF1EE">
<title>Eniram Beauty, compta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --creme:#FAF1EE; --creme2:#F1E1DE; --rose:#E9A8BB; --rose-doux:#F6DDE3; --rose-fonce:#A04A65;
  --brun:#5B3A3F; --brun-doux:#775A5E; --ligne:#E8D6D4; --champ:#FFFBFA; --ok:#4E7F5E; --alerte:#B0413A;
  --serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--brun);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.15}
h2{font-style:italic;font-size:1.6rem}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* En-tête et navigation */
.top{position:sticky;top:0;z-index:20;background:var(--creme);border-bottom:1px solid var(--ligne);
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:44px;height:44px;border-radius:50%;background:var(--rose);display:grid;place-items:center;
  font-family:var(--serif);font-size:1.35rem;letter-spacing:-.09em;color:var(--brun);padding-right:3px}
.mono.big{width:92px;height:92px;font-size:2.7rem;margin:0 auto 18px}
.word{display:flex;flex-direction:column;line-height:1}
.word span{font-family:var(--serif);font-size:1.25rem;letter-spacing:.32em;font-weight:500}
.word small{font-size:.62rem;letter-spacing:.5em;margin-top:5px;color:var(--brun-doux)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--creme);border-top:1px solid var(--ligne);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
nav button{flex:1;background:none;border:0;padding:12px 2px;font-size:.84rem;color:var(--brun-doux);cursor:pointer;border-radius:12px}
nav button.on{color:var(--brun);font-family:var(--serif);font-style:italic;font-size:1rem;font-weight:600;background:var(--rose-doux)}
@media(min-width:720px){
  body{padding-bottom:40px}
  nav{position:static;border:0;padding:0;background:none;gap:4px}
  nav button{flex:none;padding:8px 16px;font-size:.95rem}
}
main{max-width:720px;margin:0 auto;padding:22px 18px 8px}
main>section{margin-top:34px}
main>section:first-child{margin-top:0}

/* Mise en page commune */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid var(--ligne)}
.row.total{border-bottom:0;border-top:2px solid var(--brun);margin-top:4px;padding-top:14px;font-weight:600}
.row.total .num{font-family:var(--serif);font-size:1.5rem}
.muted{color:var(--brun-doux)}
.small{font-size:.88rem}
.ok{color:var(--ok)} .warn{color:var(--rose-fonce)} .neg{color:var(--alerte)}
.empty{padding:22px 0;color:var(--brun-doux)}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--ligne);padding:13px 0;cursor:pointer}
div.item{cursor:default}
.item:hover{background:rgba(246,221,227,.45)}
div.item:hover{background:none}
.i-main{display:flex;flex-direction:column;min-width:0}
.i-main b{font-weight:500;font-size:1.02rem}
.i-main small,.i-side small{color:var(--brun-doux);font-size:.84rem}
.i-side{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.i-side small.warn{color:var(--rose-fonce)} .i-side small.ok{color:var(--ok)}
.x{background:none;border:0;font-size:1.5rem;line-height:1;color:var(--brun-doux);cursor:pointer;padding:4px 8px;border-radius:10px}
.x:hover{background:var(--rose-doux)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav span{font-family:var(--serif);font-style:italic;font-size:1.15rem;min-width:9.5em;text-align:center;text-transform:capitalize}
.monthnav button{background:var(--rose-doux);border:0;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.1rem}

/* Boutons et champs */
.btn{background:var(--rose);border:0;color:var(--brun);font-weight:600;padding:12px 22px;border-radius:999px;cursor:pointer}
.btn:hover{background:#E193AA}
.btn.ghost{background:none;border:1.5px solid var(--brun);padding:10px 20px}
.btn.ghost:hover{background:var(--rose-doux)}
.btn.sm{padding:8px 16px;font-size:.9rem}
.btn.danger{background:none;color:var(--alerte);border:1.5px solid var(--alerte)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--rose-fonce);outline-offset:2px}
label{display:block;font-size:.92rem;color:var(--brun-doux);margin-top:14px}
label:first-child{margin-top:0}
input,select,textarea{display:block;width:100%;margin-top:5px;background:var(--champ);border:1.5px solid var(--ligne);border-radius:12px;padding:11px 13px;color:var(--brun)}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:center;margin-top:16px;color:var(--brun)}
.check input{width:auto;margin:0}
.err{color:var(--alerte);margin-top:10px}

/* Carte principale : l'enveloppe */
.hero{background:var(--rose-doux);border-radius:30px;padding:28px 24px 26px}
.hero .lead{font-family:var(--serif);font-style:italic;font-size:1.25rem}
.hero .big{font-family:var(--serif);font-weight:500;font-size:clamp(3.6rem,17vw,6.2rem);line-height:1;letter-spacing:-.02em;margin:8px 0 18px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.75);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose-fonce);border-radius:999px}
.hero .sub{margin-top:12px;color:var(--brun-doux)}
.hero .btn{margin-top:16px}
.bar.slim{height:8px;background:var(--creme2);margin:10px 0 6px}

/* Fenêtre de saisie */
dialog{width:min(560px,calc(100% - 20px));max-height:92vh;border:0;border-radius:26px;background:var(--creme);color:var(--brun);padding:0;overflow:auto;box-shadow:0 24px 60px rgba(91,58,63,.3)}
dialog::backdrop{background:rgba(91,58,63,.4)}
dialog header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 6px;position:sticky;top:0;background:var(--creme);z-index:1}
dialog header h2{font-size:1.5rem}
.mbody{padding:10px 22px 6px}
dialog footer{padding:14px 22px 22px;display:flex;gap:10px;flex-wrap:wrap}
.login{max-width:380px;margin:0 auto;padding:max(12vh,40px) 22px;text-align:center}
.login h1{font-style:italic;font-size:2rem;margin-bottom:6px}
.login form{text-align:left;margin-top:26px}
.login .btn{width:100%;margin-top:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--brun);color:var(--creme);
  padding:11px 20px;border-radius:999px;z-index:60;font-size:.95rem;max-width:90vw}
.toast.bad{background:var(--alerte)}
@media(min-width:720px){.toast{bottom:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ============ CONFIGURATION : à remplir une seule fois ============ */
const SUPABASE_URL = 'https://fiotoievhffjfsivgbud.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MM1zoFnf-xTHPUkVzOCiFQ_D3H0lpAH';
/* ================================================================== */

const CONFIGURED = !/COLLE_ICI/.test(SUPABASE_URL + SUPABASE_KEY);
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR'});
const eur = n => fmt.format(+n || 0);
const sum = (a, k) => a.reduce((t, x) => t + (+x[k] || 0), 0);
const nz = v => (v === '' || v == null) ? null : v;
const z2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`;
const dFR = s => new Date(s.length <= 10 ? s + 'T12:00:00' : s).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const inR = (d, [a, b]) => d >= a && d <= b;

const MOYENS = {especes:'Espèces', cb:'Carte', revolut:'Revolut', virement:'Virement', autre:'Autre'};
const CATS = {fournitures:'Fournitures', investissement:'Investissement', pub:'Pub', charge_variable:'Charge variable', perso:'Perso', autre:'Autre'};
const PRODS = {pad:'Pad', teinture:'Teinture', fourniture:'Fourniture'};
const TYPES = ['Rehaussement de cils', 'Korean lashlift', 'Browlift', 'Restructuration sourcils', 'Teinture sourcils', 'Autre'];

function monthRange(off = 0) {
  const n = new Date(), s = new Date(n.getFullYear(), n.getMonth() + off, 1), e = new Date(s.getFullYear(), s.getMonth() + 1, 0);
  return [iso(s), iso(e), s];
}
function weekRange() {
  const n = new Date(), d = (n.getDay() + 6) % 7, s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - d);
  return [iso(s), addDays(iso(s), 6)];
}

const S = {tab:'accueil', monthOffset:0, search:'', data:null, pay:{}, cmap:{}, pmap:{}};
const app = $('#app');

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200);
}

/* ---------- Données ---------- */
async function load() {
  const t = (n, o) => { let q = sb.from(n).select('*'); if (o) q = q.order(o[0], {ascending:o[1]}); return q; };
  const res = await Promise.all([
    sb.from('reglages').select('*').eq('id', 1).single(),
    t('clientes', ['nom', true]), t('produits', ['created_at', false]), t('prestations', ['date_prestation', false]),
    t('paiements', ['date_paiement', false]), t('depenses', ['date_depense', false]), t('prelevements_fixes', ['jour_du_mois', true]),
    t('revenus_perso', ['date_revenu', false]), t('campagnes_pub', ['date_debut', false])
  ]);
  const bad = res.find(r => r.error); if (bad) throw bad.error;
  const [reg, clientes, produits, prestas, paiements, depenses, prelevements, revenus, campagnes] = res.map(r => r.data);
  S.data = {reg, clientes, produits, prestas, paiements, depenses, prelevements, revenus, campagnes};
  S.pay = {}; paiements.forEach(p => (S.pay[p.prestation_id] ??= []).push(p));
  S.cmap = Object.fromEntries(clientes.map(c => [c.id, c]));
  S.pmap = Object.fromEntries(produits.map(p => [p.id, p]));
}
async function refresh() { try { await load(); render(); } catch (e) { toast(e.message || 'Erreur de chargement', true); } }
const paid = p => sum(S.pay[p.id] || [], 'montant');

/* ---------- Fenêtre de saisie ---------- */
function modal(title, body, onSubmit, label = 'Enregistrer') {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form id="mf"><header><h2>${title}</h2><button type="button" class="x" data-act="close" aria-label="Fermer">×</button></header>
    <div class="mbody">${body}</div>${onSubmit ? `<footer><button class="btn" type="submit">${label}</button></footer>` : '<footer></footer>'}</form>`;
  $('#mf').onsubmit = async e => {
    e.preventDefault();
    if (!onSubmit) return;
    const btn = e.submitter; if (btn) btn.disabled = true;
    try { await onSubmit(Object.fromEntries(new FormData(e.target))); dlg.close(); await refresh(); toast('Enregistré'); }
    catch (err) { toast(err.message || 'Erreur', true); if (btn) btn.disabled = false; }
  };
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}
const f = (label, inner) => `<label>${label}${inner}</label>`;
const opts = (pairs, sel) => pairs.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(l)}</option>`).join('');
const optsObj = (o, sel) => opts(Object.entries(o), sel);

/* ---------- Vues ---------- */
const VIEWS = {accueil, prestations, clientes, depenses, plus};

function accueil() {
  const {reg, depenses, paiements, prelevements, prestas} = S.data;
  const env = reg.enveloppe_periode === 'semaine' ? weekRange() : monthRange(0);
  const spent = sum(depenses.filter(x => x.categorie === 'perso' && inR(x.date_depense, env)), 'montant');
  const budget = +reg.enveloppe_montant || 0, left = budget - spent, pct = budget > 0 ? Math.min(100, spent / budget * 100) : 0;
  const per = reg.enveloppe_periode === 'semaine' ? 'cette semaine' : 'ce mois-ci';
  const hero = budget > 0
    ? `<section class="hero"><p class="lead">Il te reste ${per}</p><p class="big num ${left < 0 ? 'neg' : ''}">${eur(left)}</p>
       <div class="bar" role="img" aria-label="${Math.round(pct)} % de l'enveloppe dépensée"><i style="width:${pct}%"></i></div>
       <p class="sub num">${eur(spent)} dépensés sur ${eur(budget)}</p></section>`
    : `<section class="hero"><p class="lead">Ton enveloppe perso</p><p class="sub" style="margin-top:8px">Choisis un montant pour voir ce qu'il te reste à dépenser.</p>
       <button class="btn" data-act="tab" data-k="plus">Ouvrir les réglages</button></section>`;

  const mr = monthRange(S.monthOffset);
  const pm = paiements.filter(x => inR(x.date_paiement, mr));
  const enc = sum(pm, 'montant'), urs = sum(pm, 'urssaf_montant');
  const dpro = sum(depenses.filter(x => x.categorie !== 'perso' && inR(x.date_depense, mr)), 'montant');
  const byMoyen = Object.entries(MOYENS).map(([k, l]) => [l, sum(pm.filter(x => x.moyen === k), 'montant')]).filter(x => x[1] > 0);
  const label = mr[2].toLocaleDateString('fr-FR', {month:'long', year:'numeric'});

  const y = new Date().getFullYear(), ca = sum(paiements.filter(x => inR(x.date_paiement, [`${y}-01-01`, `${y}-12-31`])), 'montant');
  const plaf = +reg.plafond_ca || 0, pp = plaf > 0 ? Math.min(100, ca / plaf * 100) : 0;

  const today = new Date().getDate();
  const next = prelevements.filter(p => p.actif && p.jour_du_mois >= today);
  const attente = prestas.filter(p => +p.montant_total - paid(p) > 0.009).slice(0, 5);

  return `${hero}
  <section>
    <div class="sec-head"><h2>Le mois</h2>
      <div class="monthnav"><button data-act="month" data-d="-1" aria-label="Mois précédent">‹</button><span>${label}</span><button data-act="month" data-d="1" aria-label="Mois suivant">›</button></div></div>
    <div class="row"><span>Encaissé</span><span class="num">${eur(enc)}</span></div>
    <div class="row"><span>À mettre de côté pour l'URSSAF</span><span class="num">${eur(urs)}</span></div>
    <div class="row"><span>Dépenses pro</span><span class="num">${eur(dpro)}</span></div>
    <div class="row total"><span>Il te reste après charges</span><span class="num ${enc - urs - dpro < 0 ? 'neg' : ''}">${eur(enc - urs - dpro)}</span></div>
    ${byMoyen.length ? `<p class="muted small" style="margin-top:12px">Encaissé par moyen : ${byMoyen.map(([l, v]) => `${l} ${eur(v)}`).join(', ')}</p>` : ''}
  </section>
  ${attente.length ? `<section><div class="sec-head"><h2>Soldes à encaisser</h2></div>
    ${attente.map(p => `<button class="item" data-act="openPresta" data-id="${p.id}"><span class="i-main"><b>${esc(S.cmap[p.cliente_id]?.nom)}</b><small>${esc(p.type_prestation)}, ${dFR(p.date_prestation)}</small></span>
      <span class="i-side num warn">${eur(+p.montant_total - paid(p))}</span></button>`).join('')}</section>` : ''}
  ${plaf > 0 ? `<section><div class="sec-head"><h2>Plafond ${y}</h2><span class="num muted">${eur(ca)} sur ${eur(plaf)}</span></div>
    <div class="bar slim" role="img" aria-label="${Math.round(pp)} % du plafond atteint"><i style="width:${pp}%"></i></div>
    <p class="small ${pp >= 85 ? 'warn' : 'muted'}">${pp >= 85 ? 'Tu approches du plafond de chiffre d\'affaires.' : `Il reste ${eur(plaf - ca)} avant le plafond.`}</p></section>` : ''}
  ${next.length ? `<section><div class="sec-head"><h2>Prélèvements à venir</h2><span class="num muted">${eur(sum(next, 'montant'))}</span></div>
    ${next.map(p => `<div class="row"><span>${esc(p.libelle)}<small class="muted"> le ${p.jour_du_mois}</small></span><span class="num">${eur(p.montant)}</span></div>`).join('')}</section>` : ''}`;
}

function prestations() {
  const {prestas} = S.data;
  return `<section><div class="sec-head"><h2>Prestations</h2><button class="btn sm" data-act="newPresta">Nouvelle prestation</button></div>
  ${prestas.length ? prestas.map(p => {
    const rest = +p.montant_total - paid(p);
    return `<button class="item" data-act="openPresta" data-id="${p.id}"><span class="i-main"><b>${esc(S.cmap[p.cliente_id]?.nom)}</b><small>${esc(p.type_prestation)}, ${dFR(p.date_prestation)}</small></span>
      <span class="i-side num">${eur(p.montant_total)}<small class="${rest > 0.009 ? 'warn' : 'ok'}">${rest > 0.009 ? 'Reste ' + eur(rest) : 'Payé'}</small></span></button>`;
  }).join('') : '<p class="empty">Aucune prestation pour le moment. Ajoute la première avec le bouton ci-dessus.</p>'}</section>`;
}

function clienteList() {
  const q = S.search.trim().toLowerCase();
  const list = S.data.clientes.filter(c => !q || c.nom.toLowerCase().includes(q));
  return list.length ? list.map(c => {
    const last = S.data.prestas.find(p => p.cliente_id === c.id);
    return `<button class="item" data-act="openCliente" data-id="${c.id}"><span class="i-main"><b>${esc(c.nom)}</b><small>${last ? 'Dernière venue le ' + dFR(last.date_prestation) : 'Pas encore de prestation'}</small></span></button>`;
  }).join('') : `<p class="empty">${q ? 'Aucune cliente à ce nom.' : 'Aucune cliente pour le moment.'}</p>`;
}
function clientes() {
  return `<section><div class="sec-head"><h2>Clientes</h2><button class="btn sm" data-act="newCliente">Nouvelle cliente</button></div>
  <label style="margin-top:6px">Rechercher<input id="csearch" type="search" value="${esc(S.search)}" placeholder="Prénom ou nom"></label>
  <div id="clist" style="margin-top:6px">${clienteList()}</div></section>`;
}

function depenses() {
  const mr = monthRange(S.monthOffset), label = mr[2].toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  const list = S.data.depenses.filter(x => inR(x.date_depense, mr));
  const pro = sum(list.filter(x => x.categorie !== 'perso'), 'montant'), perso = sum(list.filter(x => x.categorie === 'perso'), 'montant');
  const fourn = sum(list.filter(x => ['fournitures', 'investissement'].includes(x.categorie)), 'montant');
  return `<section><div class="sec-head"><h2>Dépenses</h2><button class="btn sm" data-act="newDep">Nouvelle dépense</button></div>
  <div class="monthnav" style="margin:10px 0 6px"><button data-act="month" data-d="-1" aria-label="Mois précédent">‹</button><span>${label}</span><button data-act="month" data-d="1" aria-label="Mois suivant">›</button></div>
  <div class="row"><span>Pro</span><span class="num">${eur(pro)}</span></div>
  <div class="row"><span>dont fournitures et investissements</span><span class="num">${eur(fourn)}</span></div>
  <div class="row"><span>Perso</span><span class="num">${eur(perso)}</span></div>
  <div style="margin-top:18px">${list.length ? list.map(x => `<div class="item"><span class="i-main"><b>${esc(x.libelle)}</b><small>${CATS[x.categorie]}, ${dFR(x.date_depense)}${x.moyen ? ', ' + MOYENS[x.moyen] : ''}</small></span>
    <span class="i-side num">${eur(x.montant)}</span><button class="x" data-act="delDep" data-id="${x.id}" aria-label="Supprimer">×</button></div>`).join('')
    : '<p class="empty">Aucune dépense ce mois-ci.</p>'}</div></section>`;
}

function plus() {
  const {reg, produits, prelevements, revenus, campagnes, paiements} = S.data;
  const actifs = produits.filter(p => !p.date_fin), finis = produits.filter(p => p.date_fin && p.date_achat);
  const vie = {};
  finis.forEach(p => { (vie[p.nom] ??= []).push(dayDiff(p.date_achat, p.date_fin)); });
  const caSur = (a, b) => sum(paiements.filter(x => inR(x.date_paiement, [a, b])), 'montant');

  return `<section><h2>Réglages</h2>
  <form id="regf" style="margin-top:14px">
    ${f('Taux URSSAF (%)', `<input name="taux" type="number" step="0.01" min="0" max="100" required value="${reg.taux_urssaf}">`)}
    <div class="two">${f('Enveloppe perso (€)', `<input name="env" type="number" step="0.01" min="0" value="${reg.enveloppe_montant}">`)}
    ${f('Par', `<select name="per">${opts([['semaine', 'Semaine'], ['mois', 'Mois']], reg.enveloppe_periode)}</select>`)}</div>
    ${f('Plafond de chiffre d\'affaires annuel (€, facultatif)', `<input name="plafond" type="number" step="0.01" min="0" value="${reg.plafond_ca ?? ''}">`)}
    <button class="btn" style="margin-top:18px">Enregistrer les réglages</button>
  </form></section>

  <section><div class="sec-head"><h2>Prélèvements fixes</h2><button class="btn sm" data-act="newPrel">Ajouter</button></div>
  ${prelevements.length ? prelevements.map(p => `<div class="item"><span class="i-main"><b>${esc(p.libelle)}</b><small>Le ${p.jour_du_mois} du mois, ${p.actif ? 'actif' : 'suspendu'}</small></span>
    <span class="i-side num">${eur(p.montant)}</span>
    <button class="btn ghost sm" data-act="togglePrel" data-id="${p.id}">${p.actif ? 'Suspendre' : 'Réactiver'}</button>
    <button class="x" data-act="delPrel" data-id="${p.id}" aria-label="Supprimer">×</button></div>`).join('') : '<p class="empty">Aucun prélèvement fixe.</p>'}</section>

  <section><div class="sec-head"><h2>Chômage et autres revenus</h2><button class="btn sm" data-act="newChom">Ajouter</button></div>
  ${revenus.length ? revenus.slice(0, 12).map(r => `<div class="item"><span class="i-main"><b>${esc(r.libelle)}</b><small>${dFR(r.date_revenu)}</small></span>
    <span class="i-side num">${eur(r.montant)}</span><button class="x" data-act="delChom" data-id="${r.id}" aria-label="Supprimer">×</button></div>`).join('') : '<p class="empty">Rien d\'enregistré.</p>'}</section>

  <section><div class="sec-head"><h2>Produits</h2><button class="btn sm" data-act="newProd">Nouveau produit</button></div>
  ${Object.keys(vie).length ? `<p class="muted small" style="margin-bottom:6px">Durée de vie moyenne : ${Object.entries(vie).map(([n, a]) => `${esc(n)} ${Math.round(a.reduce((t, x) => t + x, 0) / a.length)} j`).join(', ')}</p>` : ''}
  ${actifs.length ? actifs.map(p => `<div class="item"><span class="i-main"><b>${esc(p.nom)}</b><small>${PRODS[p.categorie]}${p.date_achat ? ', acheté le ' + dFR(p.date_achat) : ''}</small></span>
    <button class="btn ghost sm" data-act="finiProd" data-id="${p.id}">Terminé</button><button class="x" data-act="delProd" data-id="${p.id}" aria-label="Supprimer">×</button></div>`).join('') : '<p class="empty">Aucun produit en cours. Ajoute tes pads et teintures pour les choisir à chaque prestation.</p>'}</section>

  <section><div class="sec-head"><h2>Publicités</h2><button class="btn sm" data-act="newPub">Nouvelle campagne</button></div>
  ${campagnes.length ? campagnes.map(c => {
    const len = dayDiff(c.date_debut, c.date_fin) + 1;
    const pendant = caSur(c.date_debut, c.date_fin), avant = caSur(addDays(c.date_debut, -len), addDays(c.date_debut, -1));
    const diff = pendant - avant;
    return `<div class="item"><span class="i-main"><b>${esc(c.nom)}</b><small>Du ${dFR(c.date_debut)} au ${dFR(c.date_fin)}, budget ${eur(c.budget)}</small>
      <small>Chiffre d'affaires ${eur(pendant)} pendant, ${eur(avant)} sur la même durée avant : <span class="${diff >= 0 ? 'ok' : 'neg'}">${diff >= 0 ? '+' : ''}${eur(diff)}</span></small></span>
      <button class="x" data-act="delPub" data-id="${c.id}" aria-label="Supprimer">×</button></div>`;
  }).join('') : '<p class="empty">Aucune campagne. Ajoutes-en une pour comparer ton chiffre d\'affaires avec et sans pub.</p>'}</section>

  <section><button class="btn ghost" data-act="logout">Se déconnecter</button></section>`;
}

/* ---------- Actions ---------- */
async function del(table, id, msg, after) {
  if (!confirm(msg)) return;
  const {error} = await sb.from(table).delete().eq('id', id);
  if (error) return toast(error.message, true);
  await refresh(); toast('Supprimé'); if (after) after();
}
const ACTS = {
  close() { $('#dlg').close(); },
  tab(d) { S.tab = d.k; render(); scrollTo(0, 0); },
  month(d) { S.monthOffset += +d.d; render(); },
  async logout() { await sb.auth.signOut(); },
  newPresta(d) { prestaForm(d.nom || ''); },
  openPresta(d) { prestaDetail(d.id); },
  payAdd(d) { payForm(S.data.prestas.find(p => p.id === d.id)); },
  delPresta(d) { del('prestations', d.id, 'Supprimer cette prestation et ses paiements ?', () => $('#dlg').close()); },
  delPay(d) { del('paiements', d.id, 'Supprimer ce paiement ?', () => prestaDetail(d.pid)); },
  newCliente() { clienteForm(); },
  editCliente(d) { clienteForm(S.cmap[d.id]); },
  openCliente(d) { clienteDetail(d.id); },
  newDep() { depForm(); },
  delDep(d) { del('depenses', d.id, 'Supprimer cette dépense ?'); },
  newPrel() { prelForm(); },
  async togglePrel(d) {
    const p = S.data.prelevements.find(x => x.id === d.id);
    const {error} = await sb.from('prelevements_fixes').update({actif:!p.actif}).eq('id', d.id);
    if (error) return toast(error.message, true);
    await refresh(); toast(p.actif ? 'Prélèvement suspendu' : 'Prélèvement réactivé');
  },
  delPrel(d) { del('prelevements_fixes', d.id, 'Supprimer ce prélèvement ?'); },
  newChom() { chomForm(); },
  delChom(d) { del('revenus_perso', d.id, 'Supprimer ce revenu ?'); },
  newProd() { prodForm(); },
  async finiProd(d) {
    const {error} = await sb.from('produits').update({date_fin:iso(new Date())}).eq('id', d.id);
    if (error) return toast(error.message, true);
    await refresh(); toast('Produit marqué comme terminé');
  },
  delProd(d) { del('produits', d.id, 'Supprimer ce produit ?'); },
  newPub() { pubForm(); },
  delPub(d) { del('campagnes_pub', d.id, 'Supprimer cette campagne ?'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACTS[el.dataset.act]) ACTS[el.dataset.act](el.dataset, el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'csearch') { S.search = e.target.value; $('#clist').innerHTML = clienteList(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'lf') {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const {error} = await sb.auth.signInWithPassword({email:fd.email.trim(), password:fd.password});
    if (error) return loginView('Email ou mot de passe incorrect.');
    return refresh();
  }
  if (e.target.id === 'regf') {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const {error} = await sb.from('reglages').update({
      taux_urssaf:+fd.taux, enveloppe_montant:+fd.env || 0, enveloppe_periode:fd.per,
      plafond_ca:nz(fd.plafond) == null ? null : +fd.plafond, updated_at:new Date().toISOString()
    }).eq('id', 1);
    if (error) return toast(error.message, true);
    await refresh(); toast('Réglages enregistrés');
  }
});

/* ---------- Démarrage ---------- */
async function init() {
  if (!CONFIGURED) {
    app.innerHTML = '<div class="login"><div class="mono big">EB</div><h1>Presque prêt</h1><p class="muted">Ouvre le fichier et remplace les deux lignes SUPABASE_URL et SUPABASE_KEY au début du script par celles de ton projet.</p></div>';
    return;
  }
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') loginView(); });
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return loginView();
  await refresh();
}
init();
</script>
</body>
</html>
