<style>
:root{
  --creme:#FAF1EE; --creme2:#F1E1DE; --rose:#E9A8BB; --rose-doux:#F6DDE3; --rose-fonce:#A04A65;
  --brun:#5B3A3F; --brun-doux:#775A5E; --ligne:#E8D6D4; --champ:#FFFBFA; --ok:#4E7F5E; --alerte:#B0413A;
  --serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--brun);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.15}
h2{font-style:italic;font-size:1.6rem}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* En-tête et navigation */
.top{position:sticky;top:0;z-index:20;background:var(--creme);border-bottom:1px solid var(--ligne);
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:44px;height:44px;border-radius:50%;background:var(--rose);display:grid;place-items:center;
  font-family:var(--serif);font-size:1.35rem;letter-spacing:-.09em;color:var(--brun);padding-right:3px}
.mono.big{width:92px;height:92px;font-size:2.7rem;margin:0 auto 18px}
.word{display:flex;flex-direction:column;line-height:1}
.word span{font-family:var(--serif);font-size:1.25rem;letter-spacing:.32em;font-weight:500}
.word small{font-size:.62rem;letter-spacing:.5em;margin-top:5px;color:var(--brun-doux)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--creme);border-top:1px solid var(--ligne);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
nav button{flex:1;background:none;border:0;padding:12px 2px;font-size:.84rem;color:var(--brun-doux);cursor:pointer;border-radius:12px}
nav button.on{color:var(--brun);font-family:var(--serif);font-style:italic;font-size:1rem;font-weight:600;background:var(--rose-doux)}
@media(min-width:720px){
  body{padding-bottom:40px}
  nav{position:static;border:0;padding:0;background:none;gap:4px}
  nav button{flex:none;padding:8px 16px;font-size:.95rem}
}
main{max-width:720px;margin:0 auto;padding:22px 18px 8px}
main>section{margin-top:34px}
main>section:first-child{margin-top:0}

/* Mise en page commune */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid var(--ligne)}
.row.total{border-bottom:0;border-top:2px solid var(--brun);margin-top:4px;padding-top:14px;font-weight:600}
.row.total .num{font-family:var(--serif);font-size:1.5rem}
.muted{color:var(--brun-doux)}
.small{font-size:.88rem}
.ok{color:var(--ok)} .warn{color:var(--rose-fonce)} .neg{color:var(--alerte)}
.empty{padding:22px 0;color:var(--brun-doux)}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--ligne);padding:13px 0;cursor:pointer}
div.item{cursor:default}
.item:hover{background:rgba(246,221,227,.45)}
div.item:hover{background:none}
.i-main{display:flex;flex-direction:column;min-width:0}

.i-main small,.i-side small{color:var(--brun-doux);font-size:.84rem}
.i-side{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.i-side small.warn{color:var(--rose-fonce)} .i-side small.ok{color:var(--ok)}
.x{background:none;border:0;font-size:1.5rem;line-height:1;color:var(--brun-doux);cursor:pointer;padding:4px 8px;border-radius:10px}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav span{font-family:var(--serif);font-style:italic;font-size:1.15rem;min-width:9.5em;text-align:center;text-transform:capitalize}
.monthnav button{background:var(--rose-doux);border:0;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.1rem}

/* Boutons et champs */
.btn{background:var(--rose);border:0;color:var(--brun);font-weight:600;padding:12px 22px;border-radius:999px;cursor:pointer}
.btn:hover{background:#E193AA}
.btn.ghost{background:none;border:1.5px solid var(--brun);padding:10px 20px}

.btn.sm{padding:8px 16px;font-size:.9rem}
.btn.danger{background:none;color:var(--alerte);border:1.5px solid var(--alerte)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--rose-fonce);outline-offset:2px}

input,select,textarea{display:block;width:100%;margin-top:5px;background:var(--champ);border:1.5px solid var(--ligne);border-radius:12px;padding:11px 13px;color:var(--brun)}

/* Carte principale : l'enveloppe */

.hero .lead{font-family:var(--serif);font-style:italic;font-size:1.25rem}
.hero .big{font-family:var(--serif);font-weight:500;font-size:clamp(3.6rem,17vw,6.2rem);line-height:1;letter-spacing:-.02em;margin:8px 0 18px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.75);overflow:hidden}

/* Fenêtre de saisie */
dialog{width:min(560px,calc(100% - 20px));max-height:92vh;border:0;border-radius:26px;background:var(--creme);color:var(--brun);padding:0;overflow:auto;box-shadow:0 24px 60px rgba(91,58,63,.3)}
dialog::backdrop{background:rgba(91,58,63,.4)}
dialog header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 6px;position:sticky;top:0;background:var(--creme);z-index:1}
dialog header h2{font-size:1.5rem}
.mbody{padding:10px 22px 6px}

.login{max-width:380px;margin:0 auto;padding:max(12vh,40px) 22px;text-align:center}
.login h1{font-style:italic;font-size:2rem;margin-bottom:6px}
.login form{text-align:left;margin-top:26px}
.login .btn{width:100%;margin-top:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--brun);color:var(--creme);
  padding:11px 20px;border-radius:999px;z-index:60;font-size:.95rem;max-width:90vw}
.toast.bad{background:var(--alerte)}
@media(min-width:720px){.toast{bottom:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v2 : deux univers ===== */
:root{--btn-h:#E193AA; --s1:#A04A65; --s2:#B8862F}
body[data-p="perso"]{
  --creme:#F4F2EA; --creme2:#E7E4D8; --rose:#A9C0A8; --rose-doux:#E0E9DC; --rose-fonce:#3E6A52;

.btn:hover{background:var(--btn-h)}
.pbtn{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;display:flex;align-items:center;gap:12px;border-radius:14px}
.chev{font-style:normal;color:var(--brun-doux);font-size:.9rem;margin-left:-2px}
.alt{width:40px;height:40px;border-radius:50%;border:2px solid var(--creme);box-shadow:0 0 0 1.5px var(--ligne);display:grid;place-items:center;
  font-family:var(--serif);font-weight:600;cursor:pointer;font-size:1rem;padding:0}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:1.2rem;flex:none}
.prof .item{justify-content:flex-start;gap:14px}
.prof .item .ok{margin-left:auto;font-size:1.3rem}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.kpi{background:var(--champ);border:1px solid var(--ligne);border-radius:20px;padding:14px 16px;min-width:0}
.kpi .kv{font-family:var(--serif);font-size:1.55rem;font-weight:500;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.kpi small{display:block;margin-top:4px;color:var(--brun-doux);font-size:.8rem;line-height:1.3}
.delta{font-weight:600}
small.delta.ok{color:var(--ok)} small.delta.neg{color:var(--alerte)}
.hero .delta{display:inline-block;margin-top:-6px;margin-bottom:10px;font-size:.92rem}
.hb{margin:12px 0}
.hb .row2{display:flex;justify-content:space-between;gap:12px}
.track{height:6px;border-radius:999px;background:var(--creme2);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--s1);border-radius:999px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font-family:var(--sans);fill:var(--brun-doux);font-size:12px}
.chart .gl{stroke:var(--ligne);stroke-width:1}
.chart .bar path{transition:opacity .15s}
.chart .bar:hover path{opacity:.7}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.88rem;color:var(--brun-doux)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
details.tv{margin-top:8px;font-size:.88rem;color:var(--brun-doux)}
details.tv summary{cursor:pointer;padding:4px 0}
.tbl{width:100%;border-collapse:collapse;margin-top:6px}
.tbl th,.tbl td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--ligne)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.04em;background:var(--rose-doux);color:var(--brun);border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:2px}
.note{background:var(--rose-doux);border-radius:16px;padding:14px 16px;font-size:.92rem}
.mn{display:flex;justify-content:center;margin-bottom:16px}
.pos{color:var(--ok)}

</style>

<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ============ CONFIGURATION : à remplir une seule fois ============ */
const SUPABASE_URL = 'https://fiotoievhffjfsivgbud.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MM1zoFnf-xTHPUkVzOCiFQ_D3H0lpAH';
/* ================================================================== */

const CONFIGURED = !/COLLE_ICI/.test(SUPABASE_URL + SUPABASE_KEY);
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR'});
const eur = n => fmt.format(+n || 0);
const sum = (a, k) => a.reduce((t, x) => t + (+x[k] || 0), 0);
const nz = v => (v === '' || v == null) ? null : v;
const z2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`;
const dFR = s => new Date(s.length <= 10 ? s + 'T12:00:00' : s).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const inR = (d, [a, b]) => d >= a && d <= b;

const MOYENS = {especes:'Espèces', cb:'Carte', revolut:'Revolut', virement:'Virement', autre:'Autre'};
const CATS = {fournitures:'Fournitures', investissement:'Investissement', pub:'Pub', charge_variable:'Charge variable', perso:'Perso', autre:'Autre'};
const PRODS = {pad:'Pad', teinture:'Teinture', fourniture:'Fourniture'};
const TYPES = ['Rehaussement de cils', 'Korean lashlift', 'Browlift', 'Restructuration sourcils', 'Teinture sourcils', 'Autre'];

function monthRange(off = 0) {
  const n = new Date(), s = new Date(n.getFullYear(), n.getMonth() + off, 1), e = new Date(s.getFullYear(), s.getMonth() + 1, 0);
  return [iso(s), iso(e), s];
}
function weekRange() {
  const n = new Date(), d = (n.getDay() + 6) % 7, s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - d);
  return [iso(s), addDays(iso(s), 6)];
}

const app = $('#app');

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200);
}


/* ---------- Constantes v2 ---------- */
const CATS_PRO = {fournitures:'Fournitures', investissement:'Investissement', pub:'Pub', charge_variable:'Charge variable', autre:'Autre'};
const CATS_PERSO = ['Courses', 'Sorties et loisirs', 'Shopping', 'Santé et beauté', 'Transport', 'Maison', 'Autre'];
const COMPTE_TYPES = {banque:'Banque', revolut:'Revolut', especes:'Espèces', autre:'Autre'};
const PROFILES = {
  eniram:{nom:'eniram.beauty', mono:'EB', bg:'#E9A8BB', fg:'#5B3A3F', theme:'#FAF1EE', word:['ENIRAM', 'BEAUTY'], sous:'L\'activité'},
  perso:{nom:'perso', mono:'P', bg:'#A9C0A8', fg:'#26332B', theme:'#F4F2EA', word:['PERSO', 'MES COMPTES'], sous:'L\'argent perso'}
};
const NAV = {
  eniram:[['accueil', 'Accueil'], ['prestations', 'Prestations'], ['clientes', 'Clientes'], ['depenses', 'Dépenses'], ['plus', 'Réglages']],
  perso:[['accueil', 'Accueil'], ['mouvements', 'Mouvements'], ['comptes', 'Comptes'], ['plus', 'Réglages']]
};

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const S = {profile: lsGet('eb_profile') === 'perso' ? 'perso' : 'eniram', tab:'accueil', monthOffset:0, search:'', data:null, pay:{}, cmap:{}, pmap:{}, first:null};

const dloc = s => s.length <= 10 ? s : iso(new Date(s));
const monthName = r => r[2].toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
const monthShort = r => r[2].toLocaleDateString('fr-FR', {month:'short'}).replace('.', '');

/* ---------- Données ---------- */
async function load() {
  const t = (n, o) => { let q = sb.from(n).select('*'); if (o) q = q.order(o[0], {ascending:o[1]}); return q; };
  const res = await Promise.all([
    sb.from('reglages').select('*').eq('id', 1).single(),
    t('clientes', ['nom', true]), t('produits', ['created_at', false]), t('prestations', ['date_prestation', false]),
    t('paiements', ['date_paiement', false]), t('depenses', ['date_depense', false]), t('prelevements_fixes', ['jour_du_mois', true]),
    t('revenus_perso', ['date_revenu', false]), t('campagnes_pub', ['date_debut', false]), t('comptes', ['created_at', true])
  ]);
  const bad = res.find(r => r.error); if (bad) throw bad.error;
  const [reg, clientes, produits, prestas, paiements, depenses, prelevements, revenus, campagnes, comptes] = res.map(r => r.data);
  S.data = {reg, clientes, produits, prestas, paiements, depenses, prelevements, revenus, campagnes, comptes};
  S.pay = {}; paiements.forEach(p => (S.pay[p.prestation_id] ??= []).push(p));
  S.cmap = Object.fromEntries(clientes.map(c => [c.id, c]));
  S.pmap = Object.fromEntries(produits.map(p => [p.id, p]));
  const dates = [...paiements.map(x => x.date_paiement), ...depenses.map(x => x.date_depense), ...revenus.map(x => x.date_revenu), ...prestas.map(x => dloc(x.date_prestation))];
  S.first = (dates.length ? dates.reduce((a, b) => a < b ? a : b) : iso(new Date())).slice(0, 7) + '-01';
}
async function refresh() {
  try { await load(); render(); }
  catch (e) {
    const m = e.message || '';
    if (/comptes|compte_id|univers|sous_categorie/.test(m)) {
      app.innerHTML = '<div class="login"><div class="mono big" aria-hidden="true">EB</div><h1>Une mise à jour est nécessaire</h1><p class="muted">Lance une fois le script « migration v2 » dans l\'éditeur SQL de Supabase, puis recharge cette page.</p></div>';
    } else toast(m || 'Erreur de chargement', true);
  }
}
const paid = p => sum(S.pay[p.id] || [], 'montant');

/* ---------- Calculs : Eniram ---------- */
const fixesApply = r => r[0] <= monthRange(0)[0] && r[0] >= S.first;
function eniMonth(off) {
  const r = monthRange(off), {paiements, depenses, prelevements, prestas} = S.data;
  const pm = paiements.filter(x => inR(x.date_paiement, r));
  const enc = sum(pm, 'montant'), urs = sum(pm, 'urssaf_montant');
  const dpro = sum(depenses.filter(x => x.categorie !== 'perso' && inR(x.date_depense, r)), 'montant');
  const fixes = fixesApply(r) ? sum(prelevements.filter(p => p.actif && p.univers === 'eniram'), 'montant') : 0;
  const ps = prestas.filter(p => inR(dloc(p.date_prestation), r));
  const net = enc - urs - dpro - fixes;
  return {r, pm, enc, urs, dpro, fixes, net, ps, nb:ps.length, panier:ps.length ? sum(ps, 'montant_total') / ps.length : 0, marge:enc > 0 ? net / enc : null};
}

/* ---------- Calculs : Perso (le résultat Eniram y entre automatiquement) ---------- */
function persoMonth(off) {
  const eni = eniMonth(off), {revenus, depenses, prelevements} = S.data, r = eni.r;
  const revAutres = revenus.filter(x => inR(x.date_revenu, r));
  const autres = sum(revAutres, 'montant');
  const revTot = eni.net + autres;
  const dep = depenses.filter(x => x.categorie === 'perso' && inR(x.date_depense, r));
  const depTot = sum(dep, 'montant');
  const fixes = fixesApply(r) ? sum(prelevements.filter(p => p.actif && p.univers === 'perso'), 'montant') : 0;
  const out = depTot + fixes, reste = revTot - out;
  return {r, eni, revAutres, autres, revTot, dep, depTot, fixes, out, reste, epargne:revTot > 0 ? reste / revTot : null};
}

/* ---------- Calculs : Comptes ---------- */
function soldeOf(c, r) {
  const {paiements, depenses, revenus} = S.data, ok = (d) => !r || inR(d, r);
  const inn = sum(paiements.filter(x => x.compte_id === c.id && ok(x.date_paiement)), 'montant') + sum(revenus.filter(x => x.compte_id === c.id && ok(x.date_revenu)), 'montant');
  const out = sum(depenses.filter(x => x.compte_id === c.id && ok(x.date_depense)), 'montant');
  return {inn, out, solde:(+c.solde_initial || 0) + inn - out};
}
function defaultCompte(moyen) {
  const type = moyen === 'revolut' ? 'revolut' : moyen === 'especes' ? 'especes' : 'banque';
  return (S.data.comptes.find(c => c.type === type) || {}).id || '';
}
const compteField = sel => f('Compte', `<select name="compte_id"><option value="">Aucun</option>${opts(S.data.comptes.map(c => [c.id, c.nom]), sel)}</select>`);

/* ---------- Petits composants de lecture ---------- */
function delta(cur, prev) {
  if (!prev && !cur) return '';
  if (!prev) return '<small class="muted">Rien le mois précédent</small>';
  const d = (cur - prev) / Math.abs(prev) * 100, up = d >= 0, a = Math.abs(Math.round(d));
  return `<small class="delta ${up ? 'ok' : 'neg'}">${up ? '▲ +' : '▼ −'}${a > 999 ? '&gt;999' : a} % vs mois précédent</small>`;
}
const kpi = (l, v, sub, cls = '') => `<div class="kpi"><p class="muted small">${l}</p><p class="kv num ${cls}">${v}</p>${sub || ''}</div>`;
function hbars(items, fmtv = eur) {
  const max = Math.max(0, ...items.map(i => i[1])) || 1;
  return items.map(([l, v, s]) => `<div class="hb"><div class="row2"><span>${esc(l)}</span><span class="num">${fmtv(v)}${s ? `<small class="muted"> ${s}</small>` : ''}</span></div>
    <div class="track"><i style="width:${Math.max(2, v / max * 100)}%"></i></div></div>`).join('');
}
function niceMax(m) {
  const p = Math.pow(10, Math.floor(Math.log10(m)));
  return [1, 2, 5, 10].map(k => k * p).find(v => v >= m) || m;
}
/* Barres verticales fines, 1 ou 2 séries, info-bulle au survol, tableau en dessous */
function chartBars(labels, series, title) {
  const W = 420, H = 220, pl = 48, pr = 8, pt = 16, pb = 28, iw = W - pl - pr, ih = H - pt - pb;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values.map(v => Math.max(0, v)))));
  const y = v => pt + ih - Math.max(0, v) / max * ih;
  const gw = iw / labels.length, n = series.length, bw = Math.min(22, gw * .5 / n), gap = 3;
  const eur0 = v => Math.round(v).toLocaleString('fr-FR') + ' €';
  let g = [0, .5, 1].map(k => `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(max * k)}" y2="${y(max * k)}"/><text x="${pl - 8}" y="${y(max * k) + 4}" text-anchor="end">${eur0(max * k)}</text>`).join('');
  labels.forEach((lab, i) => {
    const cx = pl + gw * i + gw / 2, tot = n * bw + (n - 1) * gap;
    const tip = `${lab} : ` + series.map(s => `${s.name} ${eur(s.values[i])}`).join(', ');
    g += `<g class="bar"><title>${esc(tip)}</title><rect x="${pl + gw * i}" y="${pt}" width="${gw}" height="${ih}" fill="transparent"/>`;
    series.forEach((s, k) => {
      const v = Math.max(0, s.values[i]), h = v / max * ih, x = cx - tot / 2 + k * (bw + gap), yy = y(v), rr = Math.min(4, h);
      if (h > 0.5) g += `<path fill="${s.color}" d="M${x},${yy + h}V${yy + rr}Q${x},${yy} ${x + Math.min(4, bw / 2)},${yy}H${x + bw - Math.min(4, bw / 2)}Q${x + bw},${yy} ${x + bw},${yy + rr}V${yy + h}Z"/>`;
    });
    g += `</g><text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(lab)}</text>`;
  });
  if (n === 1) { const i = labels.length - 1, v = series[0].values[i]; if (v > 0) g += `<text x="${pl + gw * i + gw / 2}" y="${y(v) - 6}" text-anchor="middle" style="fill:var(--brun);font-weight:600">${eur0(v)}</text>`; }
  const legend = n > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  const table = `<details class="tv"><summary>Voir en tableau</summary><table class="tbl"><tr><th></th>${series.map(s => `<th>${esc(s.name)}</th>`).join('')}</tr>
    ${labels.map((l, i) => `<tr><td>${esc(l)}</td>${series.map(s => `<td class="num">${eur(s.values[i])}</td>`).join('')}</tr>`).join('')}</table></details>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg>${legend}${table}`;
}
const sixMonths = fn => { const offs = [-5, -4, -3, -2, -1, 0].map(k => S.monthOffset + k); return {labels:offs.map(o => monthShort(monthRange(o))), vals:offs.map(fn)}; };

async function del(table, id, msg, after) {
  if (!confirm(msg)) return;

  await refresh(); toast('Supprimé'); if (after) after();
}

  const cur = c ? soldeOf(c) : null;
  modal(c ? 'Modifier le compte' : 'Nouveau compte', `
    ${f('Nom', `<input name="nom" required value="${esc(c?.nom)}">`)}
    ${f('Type', `<select name="type">${optsObj(COMPTE_TYPES, c?.type || 'banque')}</select>`)}
    ${c ? f('Solde réel actuel (€)', `<input name="actuel" type="number" step="0.01" inputmode="decimal" required value="${cur.solde.toFixed(2)}">`)
        : f('Solde de départ (€)', '<input name="depart" type="number" step="0.01" inputmode="decimal" value="0">')}
    ${c ? `<div style="margin-top:18px"><button type="button" class="btn danger sm" data-act="delCompte" data-id="${c.id}">Supprimer ce compte</button></div>` : ''}
  `, async fd => {
    const row = {nom:fd.nom.trim(), type:fd.type};
    if (c) row.solde_initial = +(+fd.actuel - (cur.inn - cur.out)).toFixed(2); else row.solde_initial = +fd.depart || 0;
    const r = c ? await sb.from('comptes').update(row).eq('id', c.id) : await sb.from('comptes').insert(row);
    if (r.error) throw r.error;
  });
}

/* ---------- Actions ---------- */
const ACTS = {
  close() { $('#dlg').close(); },
  tab(d) { S.tab = d.k; render(); scrollTo(0, 0); },
  month(d) { S.monthOffset += +d.d; render(); },
  sheet() { profileSheet(); },
  switch(d) { setProfile(d.k); },
  goComptes() { if ($('#dlg').open) $('#dlg').close(); S.tab = 'comptes'; render(); scrollTo(0, 0); },
  async logout() { if ($('#dlg').open) $('#dlg').close(); await sb.auth.signOut(); },
  newPresta(d) { prestaForm(d.nom || ''); },
  openPresta(d) { prestaDetail(d.id); },
  payAdd(d) { payForm(S.data.prestas.find(p => p.id === d.id)); },
  delPresta(d) { del('prestations', d.id, 'Supprimer cette prestation et ses paiements ?', () => $('#dlg').close()); },
  delPay(d) { del('paiements', d.id, 'Supprimer ce paiement ?', () => prestaDetail(d.pid)); },
  newCliente() { clienteForm(); },
  editCliente(d) { clienteForm(S.cmap[d.id]); },
  openCliente(d) { clienteDetail(d.id); },
  newDep(d) { depForm(d.u || 'eniram'); },
  delDep(d) { del('depenses', d.id, 'Supprimer cette dépense ?'); },
  newPrel(d) { prelForm(d.u || 'perso'); },
  async togglePrel(d) {
    const p = S.data.prelevements.find(x => x.id === d.id);
    const {error} = await sb.from('prelevements_fixes').update({actif:!p.actif}).eq('id', d.id);
    if (error) return toast(error.message, true);
    await refresh(); toast(p.actif ? 'Prélèvement suspendu' : 'Prélèvement réactivé');
  },
  delPrel(d) { del('prelevements_fixes', d.id, 'Supprimer ce prélèvement ?'); },
  newChom() { chomForm(); },
  delChom(d) { del('revenus_perso', d.id, 'Supprimer ce revenu ?'); },
  newProd() { prodForm(); },
  async finiProd(d) {
    const {error} = await sb.from('produits').update({date_fin:iso(new Date())}).eq('id', d.id);
    if (error) return toast(error.message, true);
    await refresh(); toast('Produit marqué comme terminé');
  },
  delProd(d) { del('produits', d.id, 'Supprimer ce produit ?'); },
  newPub() { pubForm(); },
  delPub(d) { del('campagnes_pub', d.id, 'Supprimer cette campagne ?'); },
  newCompte() { compteForm(); },
  editCompte(d) { compteForm(S.data.comptes.find(c => c.id === d.id)); },
  delCompte(d) { del('comptes', d.id, 'Supprimer ce compte ? Les mouvements restent, mais ne sont plus rattachés à un compte.', () => $('#dlg').close()); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACTS[el.dataset.act]) ACTS[el.dataset.act](el.dataset, el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'csearch') { S.search = e.target.value; $('#clist').innerHTML = clienteList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'moyen' && t.value) { const c = t.form && t.form.querySelector('[name=compte_id]'); if (c) c.value = defaultCompte(t.value); }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'lf') {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const {error} = await sb.auth.signInWithPassword({email:fd.email.trim(), password:fd.password});
    if (error) return loginView('Email ou mot de passe incorrect.');
    return refresh();
  }
  if (e.target.id === 'regf' || e.target.id === 'regp') {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const row = e.target.id === 'regf'
      ? {taux_urssaf:+fd.taux, plafond_ca:nz(fd.plafond) == null ? null : +fd.plafond}
      : {enveloppe_montant:+fd.env || 0, enveloppe_periode:fd.per};
    const {error} = await sb.from('reglages').update({...row, updated_at:new Date().toISOString()}).eq('id', 1);
    if (error) return toast(error.message, true);
    await refresh(); toast('Réglages enregistrés');
  }
});

/* ---------- Démarrage ---------- */
async function init() {
  if (!CONFIGURED) {
    app.innerHTML = '<div class="login"><div class="mono big">EB</div><h1>Presque prêt</h1><p class="muted">Ouvre le fichier et remplace les deux lignes SUPABASE_URL et SUPABASE_KEY au début du script par celles de ton projet.</p></div>';
    return;
  }
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') loginView(); });
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return loginView();
  await refresh();
}
init();
</script>
