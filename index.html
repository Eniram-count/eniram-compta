<!doctype html>

<style>
:root{
  --creme:#FAF1EE; --creme2:#F1E1DE; --rose:#E9A8BB; --rose-doux:#F6DDE3; --rose-fonce:#A04A65;
  --brun:#5B3A3F; --brun-doux:#775A5E; --ligne:#E8D6D4; --champ:#FFFBFA; --ok:#4E7F5E; --alerte:#B0413A;
  --serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--brun);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.15}
h2{font-style:italic;font-size:1.6rem}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* En-tête et navigation */
.top{position:sticky;top:0;z-index:20;background:var(--creme);border-bottom:1px solid var(--ligne);
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:44px;height:44px;border-radius:50%;background:var(--rose);display:grid;place-items:center;
  font-family:var(--serif);font-size:1.35rem;letter-spacing:-.09em;color:var(--brun);padding-right:3px}
.mono.big{width:92px;height:92px;font-size:2.7rem;margin:0 auto 18px}
.word{display:flex;flex-direction:column;line-height:1}
.word span{font-family:var(--serif);font-size:1.25rem;letter-spacing:.32em;font-weight:500}
.word small{font-size:.62rem;letter-spacing:.5em;margin-top:5px;color:var(--brun-doux)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--creme);border-top:1px solid var(--ligne);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
nav button{flex:1;background:none;border:0;padding:12px 2px;font-size:.84rem;color:var(--brun-doux);cursor:pointer;border-radius:12px}
nav button.on{color:var(--brun);font-family:var(--serif);font-style:italic;font-size:1rem;font-weight:600;background:var(--rose-doux)}
@media(min-width:720px){
  body{padding-bottom:40px}
  nav{position:static;border:0;padding:0;background:none;gap:4px}
  nav button{flex:none;padding:8px 16px;font-size:.95rem}
}
main{max-width:720px;margin:0 auto;padding:22px 18px 8px}
main>section{margin-top:34px}
main>section:first-child{margin-top:0}

/* Mise en page commune */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid var(--ligne)}
.row.total{border-bottom:0;border-top:2px solid var(--brun);margin-top:4px;padding-top:14px;font-weight:600}
.row.total .num{font-family:var(--serif);font-size:1.5rem}
.muted{color:var(--brun-doux)}
.small{font-size:.88rem}
.ok{color:var(--ok)} .warn{color:var(--rose-fonce)} .neg{color:var(--alerte)}
.empty{padding:22px 0;color:var(--brun-doux)}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--ligne);padding:13px 0;cursor:pointer}
div.item{cursor:default}
.item:hover{background:rgba(246,221,227,.45)}
div.item:hover{background:none}
.i-main{display:flex;flex-direction:column;min-width:0}
.i-main b{font-weight:500;font-size:1.02rem}
.i-main small,.i-side small{color:var(--brun-doux);font-size:.84rem}
.i-side{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.i-side small.warn{color:var(--rose-fonce)} .i-side small.ok{color:var(--ok)}
.x{background:none;border:0;font-size:1.5rem;line-height:1;color:var(--brun-doux);cursor:pointer;padding:4px 8px;border-radius:10px}
.x:hover{background:var(--rose-doux)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav span{font-family:var(--serif);font-style:italic;font-size:1.15rem;min-width:9.5em;text-align:center;text-transform:capitalize}
.monthnav button{background:var(--rose-doux);border:0;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.1rem}

/* Boutons et champs */
.btn{background:var(--rose);border:0;color:var(--brun);font-weight:600;padding:12px 22px;border-radius:999px;cursor:pointer}
.btn:hover{background:#E193AA}
.btn.ghost{background:none;border:1.5px solid var(--brun);padding:10px 20px}
.btn.ghost:hover{background:var(--rose-doux)}
.btn.sm{padding:8px 16px;font-size:.9rem}
.btn.danger{background:none;color:var(--alerte);border:1.5px solid var(--alerte)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--rose-fonce);outline-offset:2px}
label{display:block;font-size:.92rem;color:var(--brun-doux);margin-top:14px}
label:first-child{margin-top:0}
input,select,textarea{display:block;width:100%;margin-top:5px;background:var(--champ);border:1.5px solid var(--ligne);border-radius:12px;padding:11px 13px;color:var(--brun)}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:center;margin-top:16px;color:var(--brun)}
.check input{width:auto;margin:0}
.err{color:var(--alerte);margin-top:10px}

/* Carte principale : l'enveloppe */
.hero{background:var(--rose-doux);border-radius:30px;padding:28px 24px 26px}
.hero .lead{font-family:var(--serif);font-style:italic;font-size:1.25rem}
.hero .big{font-family:var(--serif);font-weight:500;font-size:clamp(3.6rem,17vw,6.2rem);line-height:1;letter-spacing:-.02em;margin:8px 0 18px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.75);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose-fonce);border-radius:999px}
.hero .sub{margin-top:12px;color:var(--brun-doux)}
.hero .btn{margin-top:16px}
.bar.slim{height:8px;background:var(--creme2);margin:10px 0 6px}

/* Fenêtre de saisie */
dialog{width:min(560px,calc(100% - 20px));max-height:92vh;border:0;border-radius:26px;background:var(--creme);color:var(--brun);padding:0;overflow:auto;box-shadow:0 24px 60px rgba(91,58,63,.3)}
dialog::backdrop{background:rgba(91,58,63,.4)}
dialog header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 6px;position:sticky;top:0;background:var(--creme);z-index:1}
dialog header h2{font-size:1.5rem}
.mbody{padding:10px 22px 6px}
dialog footer{padding:14px 22px 22px;display:flex;gap:10px;flex-wrap:wrap}
.login{max-width:380px;margin:0 auto;padding:max(12vh,40px) 22px;text-align:center}
.login h1{font-style:italic;font-size:2rem;margin-bottom:6px}
.login form{text-align:left;margin-top:26px}
.login .btn{width:100%;margin-top:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--brun);color:var(--creme);
  padding:11px 20px;border-radius:999px;z-index:60;font-size:.95rem;max-width:90vw}
.toast.bad{background:var(--alerte)}
@media(min-width:720px){.toast{bottom:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{--btn-h:#E193AA; --s1:#A04A65; --s2:#B8862F}

.prof .item .ok{margin-left:auto;font-size:1.3rem}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.kpi{background:var(--champ);border:1px solid var(--ligne);border-radius:20px;padding:14px 16px;min-width:0}

.delta{font-weight:600}

.hero .delta{display:inline-block;margin-top:-6px;margin-bottom:10px;font-size:.92rem}
.hb{margin:12px 0}
.hb .row2{display:flex;justify-content:space-between;gap:12px}
.track{height:6px;border-radius:999px;background:var(--creme2);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--s1);border-radius:999px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font-family:var(--sans);fill:var(--brun-doux);font-size:12px}
.chart .gl{stroke:var(--ligne);stroke-width:1}
.chart .bar path{transition:opacity .15s}
.chart .bar:hover path{opacity:.7}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.88rem;color:var(--brun-doux)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
details.tv{margin-top:8px;font-size:.88rem;color:var(--brun-doux)}
details.tv summary{cursor:pointer;padding:4px 0}
.tbl{width:100%;border-collapse:collapse;margin-top:6px}
.tbl th,.tbl td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--ligne)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.04em;background:var(--rose-doux);color:var(--brun);border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:2px}
.note{background:var(--rose-doux);border-radius:16px;padding:14px 16px;font-size:.92rem}
.mn{display:flex;justify-content:center;margin-bottom:16px}
.pos{color:var(--ok)}
.alert{margin:8px 0;padding:11px 14px;border-radius:14px;font-size:.94rem;background:var(--rose-doux);border-left:4px solid var(--brun-doux)}
.alert.warn{border-left-color:var(--s2)}
.alert.neg{border-left-color:var(--alerte)}
.item.wrap{flex-wrap:wrap}

:root{--creme:#fff; --creme2:#F4EFF0; --champ:#FAF6F7; --brun:#2B1F22; --brun-doux:#6B5A5E; --ligne:#EEE6E8}
body[data-p="perso"]{--creme:#fff; --creme2:#F0F2EE; --champ:#F7F9F6; --brun:#1F2B24; --brun-doux:#566559; --ligne:#E6EAE4}

.top{background:#fff}
main>section{margin-top:26px}
.hello{margin-bottom:14px}.hello h1{margin:0}
.btn:not(.ghost){background:var(--rose-fonce);color:#fff;border-radius:16px;min-height:48px;font-weight:600;border-color:transparent}

.item{min-height:56px}
.hero2{background:var(--rose-fonce);color:#fff;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px}

details.more>summary{list-style:none;cursor:pointer;min-height:50px;display:flex;align-items:center;justify-content:center;border:1px solid var(--ligne);border-radius:16px;font-weight:600;color:var(--rose-fonce)}

}
.btn.sm{white-space:nowrap}
.monthnav span{font-family:var(--sans);font-style:normal;font-weight:600;text-transform:capitalize}

/* ---------- Calculs : Eniram ---------- */
function eniMonth(off) {
  const r = monthRange(off), {paiements, depenses, prestas, reg, transferts} = S.data;
  const pm = paiements.filter(x => inR(x.date_paiement, r));
  const enc = sum(pm, 'montant'), urs = sum(pm, 'urssaf_montant');
  const dpro = sum(depenses.filter(x => x.categorie !== 'perso' && inR(x.date_depense, r)), 'montant');
  const fixes = fixesTotal('eniram', r);
  const ps = prestas.filter(p => inR(dloc(p.date_prestation), r));
  const restant = enc - urs, chargesPro = dpro + fixes;
  const part = +reg.part_salaire || 0, arr = +reg.arrondi_salaire || 0;
  const reco = r2(restant * part / 100), sugg = Math.max(0, floorTo(reco, arr));
  const verse = sum(transferts.filter(x => x.motif === 'salaire' && x.mois === r[0]), 'montant');
  const net = restant - chargesPro;
  const salaireRef = verse > 0 ? verse : sugg;
  return {r, pm, enc, urs, dpro, fixes, restant, chargesPro, part, reco, sugg, verse, salaireRef, partActivite:r2(restant - reco), treso:restant - salaireRef - chargesPro,
    net, ps, nb:ps.length, panier:ps.length ? sum(ps, 'montant_total') / ps.length : 0, marge:enc > 0 ? net / enc : null};
}

function persoMonth(off) {
  const eni = eniMonth(off), {revenus, depenses, transferts} = S.data, r = eni.r;
  const rv = revenus.filter(x => inR(x.date_revenu, r));
  const recus = rv.filter(x => x.statut === 'recu'), attendus = rv.filter(x => x.statut === 'attendu');
  const salaire = eni.verse;

  const revPrevus = sum(recus, 'montant') + revAttendus + salairePrevu;
  const dep = depenses.filter(x => x.categorie === 'perso' && inR(x.date_depense, r));
  const ordin = dep.filter(x => !x.exceptionnelle), exc = dep.filter(x => x.exceptionnelle);
  const depTot = sum(dep, 'montant'), fixes = fixesTotal('perso', r);
  const bud = budgetOf(r), budgetVie = bud ? +bud.budget_vie : null;

  const epargne = sum(transferts.filter(x => inR(x.date_transfert, r) && isEpargne(x.compte_dest) && !isEpargne(x.compte_source)), 'montant');

}

/* ---------- Calculs : comptes et trésorerie ---------- */
function soldeOf(c, r) {
  const {paiements, depenses, revenus, transferts, urssafPay} = S.data, ok = d => !r || inR(d, r);
  const inn = sum(paiements.filter(x => x.compte_id === c.id && ok(x.date_paiement)), 'montant') + sum(revenus.filter(x => x.compte_id === c.id && x.statut === 'recu' && ok(x.date_revenu)), 'montant')
    + sum(transferts.filter(x => x.compte_dest === c.id && ok(x.date_transfert)), 'montant');
  const out = sum(depenses.filter(x => x.compte_id === c.id && ok(x.date_depense)), 'montant') + sum(transferts.filter(x => x.compte_source === c.id && ok(x.date_transfert)), 'montant')
    + sum(urssafPay.filter(x => x.compte_id === c.id && ok(x.date_paiement)), 'montant');

function proTreso() {
  const {comptes, paiements, urssafPay} = S.data, pro = comptes.filter(c => c.univers === 'pro' && c.type !== 'epargne');
  const solde = pro.reduce((t, c) => t + soldeOf(c).solde, 0);

function alerts(scope) {

  });

    <button class="btn ghost sm" data-act="editService" data-id="${x.id}">Modifier</button><button class="x" data-act="delService" data-id="${x.id}" aria-label="Supprimer">×</button></div>`).join('') : '<p class="empty">Aucune prestation. Ajoute-les pour les choisir dans une liste.</p>'}</section>

}

/* ---------- Vues Perso ---------- */
function persoHome() {
  const m = persoMonth(S.monthOffset), pv = persoMonth(S.monthOffset - 1), six = sixMonths(o => persoMonth(o));
  const cur = S.monthOffset === 0;
  let hero;
  if (m.budgetTotal == null) {
    hero = `<section class="hero"><p class="lead">Budget vie de ${monthName(m.r)}</p><p class="sub" style="margin-top:8px">Aucun budget défini pour ce mois. Choisis-en un pour voir ce qu'il te reste.</p>
      <button class="btn" data-act="budgetForm">Définir le budget</button></section>`;
  } else {
    const left = m.resteBudget, pct = m.budgetTotal > 0 ? Math.min(100, m.spent / m.budgetTotal * 100) : 0;
    const day = new Date().getDate(), dim = new Date(m.r[2].getFullYear(), m.r[2].getMonth() + 1, 0).getDate();
    const proj = cur && m.spent > 0 ? m.spent / day * dim : null;
    hero = `<section class="hero"><p class="lead">Budget vie restant en ${monthName(m.r)}</p><p class="big num ${left < 0 ? 'neg' : ''}">${eur(left)}</p>
      <div class="bar" role="img" aria-label="${Math.round(pct)} % du budget consommé"><i style="width:${pct}%"></i></div>
      <p class="sub num">${eur(m.spent)} dépensés sur ${eur(m.budgetTotal)}${m.bud.reserve_debloquee ? ' (réserve débloquée)' : ''}</p>
      ${proj != null ? `<p class="sub num">Au rythme actuel : ${eur(proj)} en fin de mois${proj > m.budgetTotal ? ', au-dessus du budget' : ''}.</p>` : ''}
      ${m.exc.length ? `<p class="sub num">${eur(sum(m.exc, 'montant'))} de dépenses exceptionnelles non comptées dans le budget.</p>` : ''}
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="newDep" data-u="perso">Noter une dépense</button>
      ${+m.bud.reserve > 0 && !m.bud.reserve_debloquee ? `<button class="btn ghost" data-act="reserve" data-m="${m.r[0]}">Débloquer la réserve (${eur(m.bud.reserve)})</button>` : ''}
      <button class="btn ghost" data-act="budgetForm">Modifier le budget</button></div></section>`;
  }
  const cats = {}; m.dep.forEach(x => { const k = x.sous_categorie || 'Dépenses diverses'; cats[k] = (cats[k] || 0) + +x.montant; });
  const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const topDep = m.dep.slice().sort((a, b) => b.montant - a.montant).slice(0, 3);
  const today = new Date().getDate();
  const next = dueFixes('perso', m.r).slice().sort((a, b) => (a.jour_du_mois ?? 99) - (b.jour_du_mois ?? 99));
  const vieFn = o => persoMonth(o).spent;
  const cmp = [['Mois précédent', vieFn(S.monthOffset - 1)], ['Moyenne 3 mois', moy(vieFn, 3)], ['Moyenne 6 mois', moy(vieFn, 6)]];
  const prevu = m.epargnePrev;

  return `${monthNav()}${alertsHtml(alerts('perso'))}${hero}
  <div class="kpis">
    ${kpi('Revenus reçus', eur(m.revRecus), `<small>${m.revAttendus > 0 ? eur(m.revAttendus) + ' encore attendus' : 'rien d\'attendu'}</small>${delta(m.revRecus, pv.revRecus)}`)}
    ${kpi('Dépenses', eur(m.out), `<small>dont ${eur(m.fixes)} de charges fixes</small>${delta(m.out, pv.out)}`)}
    ${kpi('Épargne du mois', eur(m.epargne), `<small>versée sur les comptes d'épargne</small>`)}
    ${kpi('Taux d\'épargne', m.tauxEpargne == null ? '—' : Math.round(m.tauxEpargne * 100) + ' %', '<small>de tes revenus reçus</small>')}
  </div>
  <section><div class="sec-head"><h2>Prévision du mois</h2></div>
    <div class="row"><span>Revenus prévus (reçus, attendus, salaire ${m.salaire > 0 ? 'versé' : 'proposé'})</span><span class="num">${eur(m.revPrevus)}</span></div>
    <div class="row"><span>Charges fixes</span><span class="num">${m.fixesPrev > 0 ? '−' : ''}${eur(m.fixesPrev)}</span></div>
    <div class="row"><span>Budget vie</span><span class="num">${m.budgetVie == null ? '—' : '−' + eur(m.budgetVie)}</span></div>
    <div class="row"><span>Pot vacances</span><span class="num">${m.pot > 0 ? '−' : ''}${eur(m.pot)}</span></div>
    <div class="row total"><span>Épargne prévisionnelle</span><span class="num">${prevu == null ? '—' : eur(prevu)}</span></div>
    ${prevu != null && m.bud && +m.bud.reserve > 0 && !m.bud.reserve_debloquee ? `<p class="muted small" style="margin-top:8px">${eur(prevu - m.bud.reserve)} si la réserve de ${eur(m.bud.reserve)} est utilisée.</p>` : ''}
    <p class="muted small" style="margin-top:8px">Recalculé à partir de ce qui est réellement enregistré. Tant qu'un revenu n'est pas reçu, il reste prévisionnel.</p></section>
  <section><div class="sec-head"><h2>Six mois</h2></div>
    ${chartBars(six.labels, [{name:'Revenus reçus', color:'var(--s1)', values:six.vals.map(v => v.revRecus)}, {name:'Dépenses', color:'var(--s2)', values:six.vals.map(v => v.out)}], 'Revenus et dépenses sur six mois')}</section>
  <section><div class="sec-head"><h2>Budget vie comparé</h2></div>
    <div class="row"><span>Ce mois-ci${cur ? ' (en cours)' : ''}</span><span class="num">${eur(m.spent)}</span></div>
    ${cmp.map(([l, v]) => `<div class="row"><span>${l}</span><span class="num">${eur(v)}</span></div>`).join('')}
    ${cur ? '<p class="muted small" style="margin-top:8px">Le mois en cours est incomplet : il sera plus bas que les mois terminés.</p>' : ''}</section>
  <section><div class="sec-head"><h2>Où part l'argent</h2></div>
    ${catList.length ? hbars(catList) : '<p class="empty">Aucune dépense ce mois-ci.</p>'}
    ${topDep.length ? `<h3 style="margin-top:18px">Plus grosses dépenses</h3>${topDep.map(x => `<div class="row"><span>${esc(x.libelle)}<small class="muted"> ${dFR(x.date_depense)}</small></span><span class="num">${eur(x.montant)}</span></div>`).join('')}` : ''}</section>
  <section><div class="sec-head"><h2>D'où vient l'argent</h2></div>
    ${m.salaire > 0 || m.eni.sugg > 0 ? `<div class="row"><span>Salaire Eniram${m.salaire > 0 ? '' : ' (proposé, pas encore versé)'}</span><span class="num">${eur(m.salairePrevu)}</span></div>` : ''}
    ${m.r && S.data.revenus.filter(x => inR(x.date_revenu, m.r) && x.statut !== 'annule').map(x => `<div class="row"><span>${esc(x.libelle)}<span class="tag">${x.statut === 'recu' ? 'reçu' : 'attendu'}</span></span><span class="num">${eur(x.montant)}</span></div>`).join('')}
    <div class="row total"><span>Prévu</span><span class="num">${eur(m.revPrevus)}</span></div></section>
  ${cur && next.length ? `<section><div class="sec-head"><h2>Charges fixes du mois</h2><span class="num muted">${eur(sum(next, 'montant'))}</span></div>
    ${next.map(p => `<div class="row"><span>${esc(p.libelle)}<small class="muted"> ${p.jour_du_mois ? 'le ' + p.jour_du_mois : 'jour à préciser'}</small></span><span class="num">${eur(p.montant)}</span></div>`).join('')}</section>` : ''}`;
}

function mouvements() {
  const m = persoMonth(S.monthOffset), r = m.r, {revenus, transferts} = S.data;
  const items = [
    ...m.dep.map(x => ({d:x.date_depense, h:`<div class="item"><span class="i-main"><b>${esc(x.libelle)}${x.exceptionnelle ? '<span class="tag">exceptionnelle</span>' : ''}</b><small>${esc(x.sous_categorie || 'Dépenses diverses')}, ${dFR(x.date_depense)}${x.compte_id ? ', ' + esc(cname(x.compte_id)) : ''}</small></span>
      <span class="i-side num">−${eur(x.montant)}</span><button class="x" data-act="delDep" data-id="${x.id}" aria-label="Supprimer">×</button></div>`})),
    ...revenus.filter(x => inR(x.date_revenu, r) && x.statut !== 'annule').map(x => ({d:x.date_revenu, h:`<div class="item"><span class="i-main"><b>${esc(x.libelle)}<span class="tag">${x.statut === 'recu' ? 'reçu' : 'attendu'}</span></b><small>${SOURCES[x.source] || 'Revenu'}${x.statut === 'recu' ? ', ' + dFR(x.date_revenu) : ''}${x.compte_id ? ', ' + esc(cname(x.compte_id)) : ''}</small></span>
      <span class="i-side num ${x.statut === 'recu' ? 'pos' : 'muted'}">+${eur(x.montant)}</span>
      ${x.statut === 'attendu' ? `<button class="btn ghost sm" data-act="recevoir" data-id="${x.id}">Reçu</button>` : ''}<button class="x" data-act="delChom" data-id="${x.id}" aria-label="Supprimer">×</button></div>`})),
    ...transferts.filter(x => inR(x.date_transfert, r)).map(x => ({d:x.date_transfert, h:`<div class="item"><span class="i-main"><b>${esc(x.libelle || (x.motif === 'salaire' ? 'Salaire Eniram' : 'Transfert'))}<span class="tag">transfert</span></b><small>${esc(cname(x.compte_source) || '?')} vers ${esc(cname(x.compte_dest) || '?')}, ${dFR(x.date_transfert)}</small></span>
      <span class="i-side num muted">${eur(x.montant)}</span><button class="x" data-act="delTransfert" data-id="${x.id}" aria-label="Supprimer">×</button></div>`}))
  ].sort((a, b) => a.d < b.d ? 1 : -1);
  return `<section><div class="sec-head"><h2>Mouvements</h2></div>${monthNav()}
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px"><button class="btn sm" data-act="newDep" data-u="perso">Dépense</button><button class="btn ghost sm" data-act="newChom">Revenu</button><button class="btn ghost sm" data-act="newTransfert">Transfert</button></div>
  <p class="muted small">Les transferts entre comptes ne comptent ni comme revenu ni comme dépense.</p>
  ${items.length ? items.map(i => i.h).join('') : '<p class="empty">Aucun mouvement ce mois-ci.</p>'}</section>`;
}

function epargne() {
  const {comptes} = S.data, ep = comptes.filter(c => c.type === 'epargne'), rows = ep.map(c => ({c, s:soldeOf(c).solde}));
  const total = sum(rows.map(x => ({v:x.s})), 'v'), m = persoMonth(S.monthOffset);
  const six = sixMonths(o => persoMonth(o));
  return `${monthNav()}
  <section class="hero"><p class="lead">Épargne totale</p><p class="big num">${eur(total)}</p>
    <p class="sub num">${eur(m.epargne)} versés en ${monthName(m.r)}${m.tauxEpargne != null ? `, soit ${Math.round(m.tauxEpargne * 100)} % de tes revenus reçus` : ''}</p>
    <button class="btn" data-act="newTransfert" data-epargne="1">Verser sur l'épargne</button></section>
  <section><div class="sec-head"><h2>Mes épargnes</h2><button class="btn sm" data-act="newCompte" data-ep="1">Ajouter</button></div>
  ${rows.length ? rows.map(({c, s}) => {
    const pct = +c.objectif > 0 ? Math.min(100, s / +c.objectif * 100) : null;
    const plan = c.versement_mensuel ? `${eur(c.versement_mensuel)} par mois${c.reprise_le ? ' à partir de ' + new Date(c.reprise_le + 'T12:00:00').toLocaleDateString('fr-FR', {month:'long', year:'numeric'}) : ''}` : '';
    return `<button class="item" data-act="editCompte" data-id="${c.id}" style="flex-wrap:wrap"><span class="i-main"><b>${esc(c.nom)}</b><small>${EPARGNE_TYPES[c.epargne_type] || 'Épargne'}${plan ? ', ' + plan : ''}</small></span>
      <span class="i-side num">${eur(s)}${pct != null ? `<small>${Math.round(pct)} % de ${eur(c.objectif)}</small>` : ''}</span>
      ${pct != null ? `<span class="bar slim" style="flex-basis:100%" role="img" aria-label="${Math.round(pct)} % de l'objectif"><i style="width:${pct}%"></i></span>` : ''}</button>`;
  }).join('') : '<p class="empty">Aucun compte d\'épargne.</p>'}</section>
  <section><div class="sec-head"><h2>Versements des six derniers mois</h2></div>
    ${chartBars(six.labels, [{name:'Épargne versée', color:'var(--s1)', values:six.vals.map(v => v.epargne)}], 'Épargne versée sur six mois')}

/* ---------- Comptes (commun aux deux profils) ---------- */
function comptes() {
  const {comptes, paiements, depenses, revenus} = S.data, mr = monthRange(0);
  const rows = comptes.map(c => ({c, all:soldeOf(c), mois:soldeOf(c, mr)}));
  const groups = [['Perso', rows.filter(x => x.c.type !== 'epargne' && x.c.univers === 'perso')], ['Pro', rows.filter(x => x.c.type !== 'epargne' && x.c.univers === 'pro')], ['Épargne', rows.filter(x => x.c.type === 'epargne')]];
  const tot = rs => rs.reduce((t, x) => t + x.all.solde, 0), total = tot(rows), urs = proTreso().reserve;
  const orphan = paiements.filter(x => !x.compte_id && !x.historique).length + depenses.filter(x => !x.compte_id && x.categorie !== 'perso' ? true : !x.compte_id).length + revenus.filter(x => !x.compte_id && x.statut === 'recu').length;
  const line = ({c, all, mois}) => `<button class="item" data-act="editCompte" data-id="${c.id}"><span class="i-main"><b>${esc(c.nom)}</b>
    <small>${COMPTE_TYPES[c.type]}, ce mois-ci +${eur(mois.inn)} −${eur(mois.out)}</small></span><span class="i-side num ${all.solde < 0 ? 'neg' : ''}">${eur(all.solde)}</span></button>`;
  return `<section><div class="sec-head"><h2>Comptes</h2><div style="display:flex;gap:8px"><button class="btn ghost sm" data-act="newTransfert">Transfert</button><button class="btn sm" data-act="newCompte">Ajouter</button></div></div>
  <section class="hero" style="margin-top:12px"><p class="lead">Au total</p><p class="big num ${total < 0 ? 'neg' : ''}">${eur(total)}</p>
    <p class="sub num">dont ${eur(urs)} à réserver pour l'URSSAF, argent pro qui n'est pas à toi</p></section>
  ${groups.map(([t, rs]) => rs.length ? `<div class="sec-head" style="margin-top:22px"><h3>${t}</h3><span class="num muted">${eur(tot(rs))}</span></div>${rs.map(line).join('')}` : '').join('')}
  ${!rows.length ? '<p class="empty">Aucun compte. Ajoute ton compte perso, ton compte pro, ton épargne.</p>' : ''}
  ${orphan ? `<p class="note" style="margin-top:18px">${orphan} mouvement${orphan > 1 ? 's' : ''} sans compte ne sont pas comptés dans ces soldes. Choisis un compte à la saisie pour qu'ils le soient.</p>` : ''}
  <p class="muted small" style="margin-top:14px">Les soldes de départ sont à 0 tant que tu ne les corriges pas : touche un compte et indique son solde réel.</p></section>`;

const hFR = d => d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}).replace(':', 'h');
const jFR = d => d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const wordIn = (t, w) => new RegExp('(^|[^a-zà-ÿ0-9])' + reEsc(w) + '([^a-zà-ÿ0-9]|$)').test(t);
function matchCliente(title) {
  const t = (title || '').toLowerCase(), cl = S.data.clientes;
  const full = cl.filter(c => c.nom.trim().length >= 3 && wordIn(t, c.nom.trim().toLowerCase())).sort((a, b) => b.nom.length - a.nom.length);
  if (full.length) return full[0];
  const prem = cl.filter(c => { const p = c.nom.trim().toLowerCase().split(/\s+/)[0]; return p.length >= 3 && wordIn(t, p); });
  return prem.length === 1 ? prem[0] : null;
}
const iaKey = ev => ev.title + '|' + ev.start;
function rdvInfo(ev) {
  const d = new Date(ev.start), ia = (S.ia || {})[iaKey(ev)] || null;
  let c = (ia && ia.clienteConnue === false) ? null : matchCliente(ev.title);
  if (!c && ia && ia.cliente) { const n = ia.cliente.trim().toLowerCase(); c = S.data.clientes.find(x => x.nom.trim().toLowerCase() === n) || null; }
  const pr = c ? S.data.prestas.find(p => p.cliente_id === c.id && iso(new Date(p.date_prestation)) === iso(d)) : null;
  const pays = pr ? (S.pay[pr.id] || []) : [];
  return {d, c, ia, pr, acompte:sum(pays.filter(x => x.type === 'acompte'), 'montant'), paye:sum(pays, 'montant')};
}
function agendaBlock() {
  const A = S.agenda;
  if (!A) return '';
  if (A.error) return `<section><div class="sec-head"><h2>Prochaine cliente</h2></div><p class="empty">${esc(A.error)}</p></section>`;
  if (!A.configured) return `<section><div class="sec-head"><h2>Prochaine cliente</h2></div><p class="empty">Agenda non connecté. Colle le lien privé Google Agenda dans Réglages.</p></section>`;
  const now = Date.now(), evs = A.events.filter(e => !e.allDay && new Date(e.end).getTime() >= now);
  if (!evs.length) return `<section><div class="sec-head"><h2>Prochaine cliente</h2></div><p class="empty">Aucun rendez-vous dans les 45 prochains jours.</p></section>`;
  const n = rdvInfo(evs[0]), e = evs[0];
  const total = n.pr ? +n.pr.montant_total : 0, reste = Math.max(0, total - n.paye);
  const detail = n.pr
    ? `<div class="row"><span>Prestation</span><span>${esc(n.pr.type_prestation)}</span></div>
       <div class="row"><span>Prix</span><span class="num">${eur(total)}</span></div>
       <div class="row"><span>Acompte versé</span><span class="num">${eur(n.acompte)}</span></div>
       <div class="row"><span>Déjà payé</span><span class="num">${eur(n.paye)}</span></div>
       <div class="row"><b>Reste à payer</b><b class="num">${eur(reste)}</b></div>`
    : `<p class="muted small" style="margin:8px 0">Pas de prestation enregistrée ce jour-là${n.c ? '' : ' (cliente non reconnue dans le titre)'}. Crée-la pour suivre l'acompte.</p>
       <button class="btn sm" data-act="newPresta" data-nom="${esc(n.c ? n.c.nom : '')}" data-date="${iso(n.d)}T${z2(n.d.getHours())}:${z2(n.d.getMinutes())}">Créer la prestation</button>`;
  const suite = evs.slice(1, 5).map(x => { const i = rdvInfo(x); return `<div class="item"><span class="i-main"><b>${esc(x.title)}</b><small>${jFR(i.d)}, ${hFR(i.d)}${i.pr ? ', acompte ' + eur(i.acompte) + ', reste ' + eur(Math.max(0, +i.pr.montant_total - i.paye)) : ''}</small></span></div>`; }).join('');
  return `<section><div class="sec-head"><h2>Prochaine cliente</h2></div>
    <p><b>${esc(n.c ? n.c.nom : e.title)}</b></p><p class="muted small">${jFR(n.d)}, ${hFR(n.d)}${n.c && e.title ? ', ' + esc(e.title) : ''}${e.loc ? ', ' + esc(e.loc) : ''}</p>
    ${detail}${suite ? `<h3 style="margin-top:18px">Ensuite</h3>${suite}` : ''}</section>`;
}

         <label class="check"><input type="checkbox" name="exceptionnelle"> Dépense exceptionnelle (hors budget vie)</label>`
      : `<div class="two">${f('Catégorie', `<select name="categorie">${optsObj(CATS_PRO)}</select>`)}
         ${f('Moyen', `<select name="moyen"><option value="">Non précisé</option>${optsObj(MOYENS_DEP)}</select>`)}</div>${compteField(defaultCompte('cb'))}`}
  `, async fd => {
    const row = perso
      ? {libelle:fd.libelle.trim(), montant:+fd.montant, date_depense:fd.date, categorie:'perso', sous_categorie:fd.sous, compte_id:nz(fd.compte_id), exceptionnelle:!!fd.exceptionnelle}
      : {libelle:fd.libelle.trim(), montant:+fd.montant, date_depense:fd.date, categorie:fd.categorie, moyen:nz(fd.moyen), compte_id:nz(fd.compte_id)};
    const r = await sb.from('depenses').insert(row);
    if (r.error) throw r.error;
  });
}

function prelForm(u, p) {
  modal(p ? 'Modifier la charge fixe' : 'Nouvelle charge fixe', `
    ${f('Libellé', `<input name="libelle" required value="${esc(p?.libelle)}">`)}
    <div class="two">${f('Montant (€)', `<input name="montant" type="number" step="0.01" min="0.01" required inputmode="decimal" value="${p ? p.montant : ''}">`)}
    ${f('Jour du mois (facultatif)', `<input name="jour" type="number" min="1" max="31" inputmode="numeric" value="${p?.jour_du_mois ?? ''}">`)}</div>
    <div class="two">${f('Fréquence', `<select name="frequence">${opts([['mensuelle', 'Mensuelle'], ['annuelle', 'Annuelle']], p?.frequence || 'mensuelle')}</select>`)}
    ${f('Mois (si annuelle)', `<select name="mois"><option value="">-</option>${opts(Array.from({length:12}, (_, i) => [i + 1, new Date(2000, i, 1).toLocaleDateString('fr-FR', {month:'long'})]), p?.mois_annuel)}</select>`)}</div>
  `, async fd => {
    if (fd.frequence === 'annuelle' && !fd.mois) throw new Error('Choisis le mois du prélèvement annuel.');
    const row = {libelle:fd.libelle.trim(), montant:+fd.montant, jour_du_mois:fd.jour ? +fd.jour : null, frequence:fd.frequence, mois_annuel:fd.frequence === 'annuelle' ? +fd.mois : null};
    const r = p ? await sb.from('prelevements_fixes').update(row).eq('id', p.id) : await sb.from('prelevements_fixes').insert({...row, univers:u, categorie:p?.categorie ?? 'Charges fixes'});
    if (r.error) throw r.error;
  });
}

function revenuForm() {
  modal('Nouveau revenu', `
    ${f('Libellé', '<input name="libelle" required value="Chômage">')}
    <div class="two">${f('Montant (€)', '<input name="montant" type="number" step="0.01" min="0.01" required inputmode="decimal">')}
    ${f('Date (ou mois prévu)', `<input name="date" type="date" required value="${iso(new Date())}">`)}</div>
    <div class="two">${f('Source', `<select name="source">${optsObj(SOURCES)}</select>`)}
    ${f('Statut', `<select name="statut">${opts([['recu', 'Reçu'], ['attendu', 'Attendu']])}</select>`)}</div>
    ${compteField(comptePerso(), 'compte_id', 'Compte destinataire')}
  `, async fd => {
    const r = await sb.from('revenus_perso').insert({libelle:fd.libelle.trim(), montant:+fd.montant, date_revenu:fd.date, source:fd.source, statut:fd.statut, compte_id:nz(fd.compte_id)});
    if (r.error) throw r.error;
  });
}
function recevoirForm(x) {
  modal('Revenu reçu', `<p class="muted">${esc(x.libelle)}, ${eur(x.montant)}</p>
    ${f('Date de réception', `<input name="date" type="date" required value="${iso(new Date())}">`)}
    ${compteField(x.compte_id || comptePerso(), 'compte_id', 'Compte destinataire')}
  `, async fd => {
    const r = await sb.from('revenus_perso').update({statut:'recu', date_revenu:fd.date, compte_id:nz(fd.compte_id)}).eq('id', x.id);
    if (r.error) throw r.error;
  }, 'Marquer comme reçu');
}

function compteForm(c, ep) {
  const cur = c ? soldeOf(c) : null, isEp = ep || c?.type === 'epargne';
  modal(c ? 'Modifier le compte' : 'Nouveau compte', `
    ${f('Nom', `<input name="nom" required value="${esc(c?.nom)}">`)}
    <div class="two">${f('Type', `<select name="type">${optsObj(COMPTE_TYPES, c?.type || (ep ? 'epargne' : 'banque'))}</select>`)}
    ${f('Univers', `<select name="univers">${opts([['perso', 'Personnel'], ['pro', 'Professionnel']], c?.univers || 'perso')}</select>`)}</div>
    ${c ? f('Solde réel actuel (€)', `<input name="actuel" type="number" step="0.01" inputmode="decimal" required value="${cur.solde.toFixed(2)}">`)
        : f('Solde de départ (€)', '<input name="depart" type="number" step="0.01" inputmode="decimal" value="0">')}
    <h3 style="margin-top:22px">Épargne (facultatif)</h3>
    ${f('Type d\'épargne', `<select name="epargne_type"><option value="">Aucun</option>${optsObj(EPARGNE_TYPES, c?.epargne_type || (isEp ? 'generale' : ''))}</select>`)}
    <div class="two">${f('Objectif (€)', `<input name="objectif" type="number" step="0.01" min="0" value="${c?.objectif ?? ''}">`)}
    ${f('Versement mensuel (€)', `<input name="versement" type="number" step="0.01" min="0" value="${c?.versement_mensuel ?? ''}">`)}</div>
    ${f('Versements à partir du', `<input name="reprise" type="date" value="${c?.reprise_le ?? ''}">`)}
    ${c ? `<div style="margin-top:18px"><button type="button" class="btn danger sm" data-act="delCompte" data-id="${c.id}">Supprimer ce compte</button></div>` : ''}
  `, async fd => {
    const row = {nom:fd.nom.trim(), type:fd.type, univers:fd.univers, epargne_type:nz(fd.epargne_type), objectif:nz(fd.objectif) == null ? null : +fd.objectif,
      versement_mensuel:nz(fd.versement) == null ? null : +fd.versement, reprise_le:nz(fd.reprise)};
    if (c) row.solde_initial = r2(+fd.actuel - (cur.inn - cur.out)); else row.solde_initial = +fd.depart || 0;
    const r = c ? await sb.from('comptes').update(row).eq('id', c.id) : await sb.from('comptes').insert(row);
    if (r.error) throw r.error;
  });
}

function transfertForm(ep) {
  const eps = S.data.comptes.find(c => c.type === 'epargne');
  modal(ep ? 'Verser sur l\'épargne' : 'Transfert entre comptes', `
    <p class="muted small">Un transfert déplace de l'argent d'un compte à l'autre. Ce n'est ni un revenu ni une dépense.</p>
    <div class="two">${compteField(ep ? comptePerso() : defaultCompte('cb'), 'source', 'Depuis', 'Choisir')}${compteField(ep ? (eps || {}).id : comptePerso(), 'dest', 'Vers', 'Choisir')}</div>
    <div class="two">${f('Montant (€)', '<input name="montant" type="number" step="0.01" min="0.01" required inputmode="decimal">')}
    ${f('Date', `<input name="date" type="date" required value="${iso(new Date())}">`)}</div>
    ${f('Libellé (facultatif)', '<input name="libelle">')}
  `, async fd => {
    if (!fd.source || !fd.dest) throw new Error('Choisis les deux comptes.');
    if (fd.source === fd.dest) throw new Error('Les deux comptes doivent être différents.');
    const motif = isEpargne(fd.dest) && !isEpargne(fd.source) ? 'epargne' : 'autre';
    const r = await sb.from('transferts').insert({date_transfert:fd.date, montant:+fd.montant, compte_source:fd.source, compte_dest:fd.dest, motif, libelle:nz(fd.libelle)});
    if (r.error) throw r.error;
  }, 'Confirmer le transfert');
}

function salaireForm() {
  const m = eniMonth(S.monthOffset), r = m.r, tr = proTreso();
  modal('Verser mon salaire', `
    <p class="muted">${monthName(r)}</p>
    <div class="row"><span>Reste après URSSAF</span><span class="num">${eur(m.restant)}</span></div>
    <div class="row"><span>Salaire à ${m.part} %</span><span class="num">${eur(m.reco)}</span></div>
    <div class="row"><span>Déjà versé ce mois-ci</span><span class="num">${eur(m.verse)}</span></div>
    <div class="row"><span>Disponible sur le pro (après URSSAF et charges)</span><span class="num ${tr.dispo < 0 ? 'neg' : ''}">${eur(tr.dispo)}</span></div>
    ${f('Montant à te verser (€)', `<input name="montant" type="number" step="0.01" min="0.01" required inputmode="decimal" value="${Math.max(0, r2(m.sugg - m.verse)) || ''}">`)}
    <div class="two">${compteField(defaultCompte('cb'), 'source', 'Depuis le compte pro', 'Choisir')}${compteField(comptePerso(), 'dest', 'Vers le compte perso', 'Choisir')}</div>
    <p class="muted small" style="margin-top:12px">Rien ne part tant que tu ne confirmes pas. Cette appli enregistre le virement, elle ne touche pas à ta banque.</p>
  `, async fd => {
    if (!fd.source || !fd.dest) throw new Error('Choisis les deux comptes.');
    if (fd.source === fd.dest) throw new Error('Les deux comptes doivent être différents.');
    const x = await sb.from('transferts').insert({date_transfert:iso(new Date()), montant:+fd.montant, compte_source:fd.source, compte_dest:fd.dest, motif:'salaire', mois:r[0], libelle:'Salaire Eniram ' + monthName(r)});
    if (x.error) throw x.error;
  }, 'Confirmer le versement');
}

function urssafForm() {
  const tr = proTreso();
  modal('URSSAF payée', `
    <p class="muted small">À réserver pour le moment : ${eur(tr.reserve)}.</p>
    <div class="two">${f('Montant (€)', `<input name="montant" type="number" step="0.01" min="0.01" required inputmode="decimal" value="${tr.reserve > 0 ? r2(tr.reserve) : ''}">`)}
    ${f('Date', `<input name="date" type="date" required value="${iso(new Date())}">`)}</div>
    ${f('Période (facultatif)', '<input name="periode" placeholder="ex. 3e trimestre 2026">')}
    ${compteField(defaultCompte('cb'), 'compte_id', 'Payé depuis')}
  `, async fd => {
    const r = await sb.from('urssaf_paiements').insert({montant:+fd.montant, date_paiement:fd.date, periode:nz(fd.periode), compte_id:nz(fd.compte_id)});
    if (r.error) throw r.error;
  });
}

async function saveBudget(budget, reserve) {
  const r = monthRange(S.monthOffset), ex = budgetOf(r);
  const {error} = await sb.from('budgets_mensuels').upsert({mois:r[0], budget_vie:+budget, reserve:+reserve || 0, reserve_debloquee:ex ? ex.reserve_debloquee : false}, {onConflict:'mois'});
  if (error) throw error;
}
function budgetForm() {
  const m = persoMonth(S.monthOffset);
  modal('Budget vie de ' + monthName(m.r), `
    <div class="two">${f('Budget vie (€)', `<input name="budget" type="number" step="0.01" min="0" required inputmode="decimal" value="${m.bud ? m.bud.budget_vie : ''}">`)}
    ${f('Réserve exceptionnelle (€)', `<input name="reserve" type="number" step="0.01" min="0" inputmode="decimal" value="${m.bud ? m.bud.reserve : 0}">`)}</div>
    <p class="muted small" style="margin-top:12px">La réserve n'est comptée dans le budget que si tu la débloques.</p>
  `, async fd => { await saveBudget(fd.budget, fd.reserve); });
}
function catForm() {
  modal('Nouvelle catégorie', f('Nom', '<input name="nom" required>'), async fd => {
    const ordre = Math.max(0, ...S.data.categories.map(c => c.ordre || 0)) + 1;
    const r = await sb.from('categories_perso').insert({nom:fd.nom.trim(), ordre});
    if (r.error) throw r.error;
  });
}

function exportCsv() {
  const d = S.data, rows = [['type', 'date', 'libelle', 'montant', 'categorie', 'compte', 'statut']];
  d.depenses.forEach(x => rows.push(['depense', x.date_depense, x.libelle, x.montant, x.sous_categorie || x.categorie, cname(x.compte_id), x.exceptionnelle ? 'exceptionnelle' : '']));
  d.revenus.forEach(x => rows.push(['revenu', x.date_revenu, x.libelle, x.montant, x.source, cname(x.compte_id), x.statut]));
  d.paiements.forEach(x => rows.push(['paiement', x.date_paiement, (S.cmap[(d.prestas.find(p => p.id === x.prestation_id) || {}).cliente_id] || {}).nom || '', x.montant, x.moyen, cname(x.compte_id), 'urssaf ' + x.urssaf_montant]));
  d.transferts.forEach(x => rows.push(['transfert', x.date_transfert, x.libelle || '', x.montant, x.motif, cname(x.compte_source) + ' > ' + cname(x.compte_dest), '']));
  d.urssafPay.forEach(x => rows.push(['urssaf payee', x.date_paiement, x.periode || '', x.montant, '', cname(x.compte_id), '']));
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv'})); a.download = 'eniram-export.csv'; a.click();
}

/* ---------- Actions ---------- */
const ACTS = {
  close() { $('#dlg').close(); },
  tab(d) { S.tab = d.k; render(); scrollTo(0, 0); },
  month(d) { S.monthOffset += +d.d; render(); },
  sheet() { profileSheet(); },
  switch(d) { setProfile(d.k); },
  goComptes() { if ($('#dlg').open) $('#dlg').close(); S.tab = 'comptes'; render(); scrollTo(0, 0); },
  async logout() { if ($('#dlg').open) $('#dlg').close(); await sb.auth.signOut(); },
  newPresta(d) { prestaForm(d.nom || '', d.date || '', d.type || ''); },
  openPresta(d) { prestaDetail(d.id); },
  payAdd(d) { payForm(S.data.prestas.find(p => p.id === d.id)); },
  delPresta(d) { del('prestations', d.id, 'Supprimer cette prestation et ses paiements ?', () => $('#dlg').close()); },
  delPay(d) { del('paiements', d.id, 'Supprimer ce paiement ?', () => prestaDetail(d.pid)); },
  newCliente() { clienteForm(); },
  editCliente(d) { clienteForm(S.cmap[d.id]); },
  openCliente(d) { clienteDetail(d.id); },
  newDep(d) { depForm(d.u || (S.profile === 'perso' ? 'perso' : 'eniram')); },
  delDep(d) { del('depenses', d.id, 'Supprimer cette dépense ?'); },
  newPrel(d) { prelForm(d.u || 'perso'); },
  editPrel(d) { const p = S.data.prelevements.find(x => x.id === d.id); prelForm(p.univers, p); },
  async togglePrel(d) {
    const p = S.data.prelevements.find(x => x.id === d.id);
    const {error} = await sb.from('prelevements_fixes').update({actif:!p.actif}).eq('id', d.id);
    if (error) return toast(error.message, true);
    await refresh(); toast(p.actif ? 'Charge suspendue' : 'Charge réactivée');
  },
  delPrel(d) { del('prelevements_fixes', d.id, 'Supprimer cette charge fixe ?'); },
  newChom() { revenuForm(); },
  recevoir(d) { recevoirForm(S.data.revenus.find(x => x.id === d.id)); },
  delChom(d) { del('revenus_perso', d.id, 'Supprimer ce revenu ?'); },
  newProd() { prodForm(); },
  allPrestas() { S.allPrestas = true; render(); },
  ignRdv(d) { const l = JSON.parse(lsGet('eb_ign') || '[]'); if (d.key && !l.includes(d.key)) l.push(d.key); lsSet('eb_ign', JSON.stringify(l.slice(-200))); render(); },
  showIgn() { lsSet('eb_ign', '[]'); render(); },
  newService() { serviceForm(); },
  editService(d) { serviceForm(S.data.services.find(x => x.id === d.id)); },
  delService(d) { del('services', d.id, 'Supprimer cette prestation de la liste ?'); },
  urssafHisto() { appliquerUrssafHisto(); },
  async finiProd(d) {
    const {error} = await sb.from('produits').update({date_fin:iso(new Date())}).eq('id', d.id);
    if (error) return toast(error.message, true);
    await refresh(); toast('Produit marqué comme terminé');
  },
  delProd(d) { del('produits', d.id, 'Supprimer ce produit ?'); },
  newPub() { pubForm(); },
  delPub(d) { del('campagnes_pub', d.id, 'Supprimer cette campagne ?'); },
  newCompte(d) { compteForm(null, !!d.ep); },
  editCompte(d) { compteForm(S.data.comptes.find(c => c.id === d.id)); },
  delCompte(d) { del('comptes', d.id, 'Supprimer ce compte ? Les mouvements restent, mais ne sont plus rattachés à un compte.', () => $('#dlg').close()); },
  newTransfert(d) { transfertForm(!!d.epargne); },
  delTransfert(d) { del('transferts', d.id, 'Supprimer ce transfert ?'); },
  newSalaire() { salaireForm(); },
  newUrssaf() { urssafForm(); },
  delUrssaf(d) { del('urssaf_paiements', d.id, 'Supprimer ce paiement URSSAF ?'); },
  budgetForm() { budgetForm(); },
  async reserve(d) {
    const {error} = await sb.from('budgets_mensuels').update({reserve_debloquee:true}).eq('mois', d.m);
    if (error) return toast(error.message, true);
    await refresh(); toast('Réserve débloquée');
  },
  newCat() { catForm(); },
  delCat(d) { del('categories_perso', d.id, 'Supprimer cette catégorie ? Les dépenses déjà notées la gardent.'); },
  exportCsv() { exportCsv(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACTS[el.dataset.act]) ACTS[el.dataset.act](el.dataset, el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'csearch') { S.search = e.target.value; $('#clist').innerHTML = clienteList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'service') {
    const w = $('#autreWrap'); if (w) w.style.display = t.value === '__autre' ? 'block' : 'none';
    const o = t.selectedOptions[0], m = t.form && t.form.querySelector('[name=montant_total]');
    if (o && o.dataset.prix != null && m) m.value = o.dataset.prix;
  }
  if (t.name === 'moyen' && t.value) { const c = t.form && t.form.querySelector('[name=compte_id]'); if (c) c.value = defaultCompte(t.value); }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'lf') {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const {error} = await sb.auth.signInWithPassword({email:fd.email.trim(), password:fd.password});
    if (error) return loginView('Email ou mot de passe incorrect.');
    return refresh();
  }
  if (e.target.id === 'regf') {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const {error} = await sb.from('reglages').update({taux_urssaf:+fd.taux, part_salaire:+fd.part, arrondi_salaire:+fd.arrondi || 0,
      plafond_ca:nz(fd.plafond) == null ? null : +fd.plafond, agenda_ical:nz(fd.agenda), updated_at:new Date().toISOString()}).eq('id', 1);
    if (error) return toast(error.message, true);
    await refresh(); toast('Réglages enregistrés');
  }
  if (e.target.id === 'regb') {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    try { await saveBudget(fd.budget, fd.reserve); await refresh(); toast('Budget enregistré'); } catch (err) { toast(err.message, true); }
  }
});

/* ---------- Démarrage ---------- */
async function init() {
  if (!CONFIGURED) {
    app.innerHTML = '<div class="login"><div class="mono big">EB</div><h1>Presque prêt</h1><p class="muted">Ouvre le fichier et remplace les deux lignes SUPABASE_URL et SUPABASE_KEY au début du script par celles de ton projet.</p></div>';
    return;
  }
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') loginView(); });
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return loginView();
  await refresh();
}
init();
</script>
